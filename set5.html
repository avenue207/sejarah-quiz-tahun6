body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

<script>
const Q=[{"q": "马来西亚面积最大的州是哪个？", "opts": ["沙巴", "砂拉越", "彭亨", "柔佛"], "ans": 1, "exp": "砂拉越（Sarawak）是马来西亚面积最大的州，位于婆罗洲岛北部，约占马来西亚总面积的37%。"}, {"q": "以下哪个州以伊班族长屋（Rumah Panjang）文化著称？", "opts": ["霹雳", "彭亨", "砂拉越（Sarawak）", "雪兰莪"], "ans": 2, "exp": "砂拉越的土著族群，尤其是伊班族，以传统的长屋文化著称，一栋长屋可容纳多户家庭共同居住。"}, {"q": "1938年提出大马来由（Melayu Raya）概念的两位本地领袖是谁？", "opts": ["东姑阿都拉曼与敦阿都拉萨", "依布拉欣耶谷与哈仑阿米努拉昔", "李光耀与敦天猛公朱加巴里恩", "敦拿督慕斯达法哈仑与史蒂芬卡隆宁甘"], "ans": 1, "exp": "课文指出，1938年，依布拉欣耶谷（Ibrahim Haji Yaakob）和哈仑阿米努拉昔（Harun Aminurrashid）提出大马来由（Melayu Raya）的概念。"}, {"q": "色拉尼族（Serani）又称什么，是哪两个群体通婚的后代？", "opts": ["峇峇；中国商人与本地女性", "土生印度人；印度商人与本地女性", "欧亚裔；葡萄牙人与本地人", "暹罗人；泰族与马来人"], "ans": 2, "exp": "课文指出，色拉尼族（Serani）又称欧亚裔，是葡萄牙人和本地人通婚的后代。"}, {"q": "国家原则由哪个机构的委员会制定？", "opts": ["国会", "内阁特别委员会", "国家咨询理事会（MAPEN）属下的国家原则委员会", "最高元首御前会议"], "ans": 2, "exp": "国家原则于1970年3月4日由国家咨询理事会（MAPEN）属下的国家原则委员会所制定。"}, {"q": "沙巴的首府是哪个城市？", "opts": ["古晋", "诗巫", "美里", "亚庇（Kota Kinabalu）"], "ans": 3, "exp": "亚庇（Kota Kinabalu）是沙巴州的首府，以京那巴鲁山著称。"}, {"q": "国家原则必须成为马来西亚人民的什么？", "opts": ["娱乐指南", "生活指南", "经济指南", "政治指南"], "ans": 1, "exp": "课文明确指出，国家原则必须成为马来西亚人民的生活指南。"}, {"q": "独立前印度族主要居住在哪里，从事什么经济活动？", "opts": ["市镇，经商", "园丘与市郊，园丘工作、小生意与码头工人", "内陆，农耕", "沿海，捕鱼"], "ans": 1, "exp": "课文指出，独立前，印度族住在园丘与市郊，从事园丘、小生意与码头工人的工作。"}, {"q": "国家原则的宗旨是什么？", "opts": ["增加国防开支", "培养团结且具包容态度的国民，是促进忠诚与爱国精神的指南", "促进对外贸易", "提高国民生产总值"], "ans": 1, "exp": "课文指出，国家原则旨在培养团结且具包容态度的国民，是促进忠诚与爱国精神的指南。"}, {"q": "东姑阿都拉曼所属的政党是什么？", "opts": ["马华公会（MCA）", "马来民族统一机构（UMNO/巫统）", "新加坡人民行动党（PAP）", "砂拉越保守党（PESAKA）"], "ans": 1, "exp": "东姑阿都拉曼（Tunku Abdul Rahman Putra Al-Haj）是马来民族统一机构（UMNO/巫统）领袖。"}, {"q": "以下哪个州首府是新山（Johor Bahru），与新加坡隔海相望？", "opts": ["马六甲", "雪兰莪", "柔佛（Johor）", "森美兰"], "ans": 2, "exp": "柔佛州（Johor）首府新山（Johor Bahru），与新加坡隔柔佛海峡相望。"}, {"q": "东马的两个州位于哪个大岛上？", "opts": ["苏门答腊", "爪哇", "婆罗洲（Borneo）", "苏拉威西"], "ans": 2, "exp": "沙巴和砂拉越位于婆罗洲岛（Borneo）北部，婆罗洲是世界第三大岛。"}, {"q": "忠于君国（Kesetiaan kepada Raja dan Negara）是国家原则第几项？", "opts": ["第一项", "第二项", "第三项", "第四项"], "ans": 1, "exp": "国家原则第二项是忠于君国（Kesetiaan kepada Raja dan Negara），强调对最高元首和国家的忠诚。"}, {"q": "峇峇和娘惹是哪两个群体通婚的后代？", "opts": ["英国人与马来人", "来自中国的商人与马六甲当地女性", "印度商人与华族女性", "葡萄牙人与马来人"], "ans": 1, "exp": "课文指出，峇峇和娘惹是早期来自中国的商人和马六甲当地女性通婚的后代，男称峇峇，女称娘惹。"}, {"q": "伊班族女性在嘉华节穿什么传统服装？", "opts": ["纱丽", "马来套装", "纺织图案的彩布（pua kumbu）", "旗袍"], "ans": 2, "exp": "课文指出，在嘉华节或婚宴时，伊班族女性穿上纺织图案的彩布（pua kumbu）。"}, {"q": "色拉尼族使用哪两种语言沟通？", "opts": ["马来语和淡米尔语", "克里斯坦语（Kristang）和英语", "旁遮普语和马来语", "峇峇语和华语"], "ans": 1, "exp": "课文指出，色拉尼族使用克里斯坦语（Kristang）和英语。"}, {"q": "富有爱国精神的国民会尊重哪些国家象征？", "opts": ["政党旗帜", "城市标志", "国旗、国徽和国歌", "首相官邸"], "ans": 2, "exp": "课文指出，富有爱国精神的国民会效忠国家，尊重国家主权的象征如国旗、国徽和国歌。"}, {"q": "敦阿都拉萨在成立马来西亚进程中的职务是什么？", "opts": ["首席部长", "马来亚联合邦副首相兼跨政府委员会成员", "砂拉越首席部长", "外交部长"], "ans": 1, "exp": "敦阿都拉萨是马来亚联合邦副首相，也是JAK成员，并代表马来亚联合邦在伦敦签署《马来西亚协定》。"}, {"q": "仄迪族（Chetti）是哪两个群体通婚的后代？", "opts": ["英国人与本地人", "来自中国的商人与当地女性", "来自印度的商人与本地女子", "葡萄牙人与马来人"], "ans": 2, "exp": "课文指出，仄迪族（Chetti）或土生印度人是来自印度的商人与本地女子通婚后所生的后代。"}, {"q": "成立马来西亚进程中，在葛波委员会报告之后才发生的步骤是什么？", "opts": ["东姑阿都拉曼在艾德菲酒店提出概念", "成立JSKM忠诚委员会", "成立JAK跨政府委员会及新加坡公投", "东姑阿都拉曼访问砂拉越"], "ans": 2, "exp": "根据课文时间线，葛波委员会于1962年6月21日移交报告，之后才成立JAK（1962年8月30日）并举行新加坡公投。"}, {"q": "东姑阿都拉曼于1961年7月访问砂拉越的目的是什么？", "opts": ["签署协定", "向当地领袖说明成立马来西亚的概念", "主持葛波委员会调查", "宣布马来西亚成立"], "ans": 1, "exp": "根据课文时间线，1961年7月东姑阿都拉曼访问砂拉越，目的是向当地领袖说明成立马来西亚的概念。"}, {"q": "东马沙巴和砂拉越于哪一年加入马来西亚联邦？", "opts": ["1957年", "1960年", "1963年", "1965年"], "ans": 2, "exp": "沙巴和砂拉越于1963年9月16日与马来亚联合邦和新加坡共同组成马来西亚联邦。"}, {"q": "马来半岛最南端的州是哪个，与新加坡隔海峡相望？", "opts": ["马六甲", "森美兰", "柔佛", "雪兰莪"], "ans": 2, "exp": "柔佛州（Johor）位于马来半岛最南端，与新加坡之间以柔佛海峡相隔。"}, {"q": "马来西亚共有多少个州和联邦直辖区？", "opts": ["11州2联邦直辖区", "12州3联邦直辖区", "13州3联邦直辖区", "14州2联邦直辖区"], "ans": 2, "exp": "马来西亚由13个州和3个联邦直辖区（吉隆坡、布城、纳闽）共16个行政区划组成。"}, {"q": "东姑阿都拉曼于1961年5月27日在哪里提出成立马来西亚的概念？", "opts": ["吉隆坡默迪卡广场", "伦敦马尔伯勒大楼", "新加坡艾德菲酒店", "砂拉越古晋"], "ans": 2, "exp": "东姑阿都拉曼于1961年5月27日在新加坡艾德菲（Adelphi）酒店提出成立马来西亚的概念。"}, {"q": "维护宪法（Keluhuran Perlembagaan）是国家原则第几项？", "opts": ["第一项", "第二项", "第三项", "第四项"], "ans": 2, "exp": "国家原则第三项是维护宪法（Keluhuran Perlembagaan），强调尊重联邦宪法的崇高地位。"}, {"q": "新加坡公投的结果是什么？", "opts": ["人民反对", "投票各半", "人民支持成立马来西亚", "公投被取消"], "ans": 2, "exp": "新加坡举行的公投结果显示，新加坡人民支持成立马来西亚。"}, {"q": "制定国家原则三大原因中的政治因素是什么？", "opts": ["经济地位的落差", "居住地区的分化", "政治理念的不同", "宗教分歧"], "ans": 2, "exp": "制定国家原则的政治因素是政治理念的不同——各族群在政治上的分歧需要通过国家原则来调和。"}, {"q": "课文中吉塔一家人及邻居按各自宗教信仰为病父祈祷，体现了哪项国家原则？", "opts": ["信奉上苍", "忠于君国", "维护宪法", "尊崇法治"], "ans": 0, "exp": "课文举例（吉塔）：一家人和邻居按各自的宗教信仰为她发高烧的父亲祈祷，体现了信奉上苍及族群包容的精神。"}, {"q": "独立前马来族主要居住在哪里，从事什么经济活动？", "opts": ["市镇，采矿", "园丘，橡胶种植", "乡村、沿海地带与河畔，农耕、捕鱼、小生意与公共服务", "内陆，狩猎"], "ans": 2, "exp": "课文指出，独立前，马来族住在乡村、沿海地带与河畔，从事农耕、捕鱼、小生意与公共服务。"}, {"q": "我们应该如何看待成立马来西亚进程中的各方领袖？", "opts": ["批评他们的决策", "遗忘他们的付出", "珍惜他们的贡献与智慧", "质疑他们的动机"], "ans": 2, "exp": "课文明确指出：对于提出成立马来西亚概念的领袖，我们应该珍惜他们的贡献与智慧。"}, {"q": "马来族男性的传统服装名称是什么？", "opts": ["长衫", "陀地（doti）", "旗袍", "马来男装（baju Melayu）"], "ans": 3, "exp": "课文指出，马来族男性的传统服装是马来男装（baju Melayu）。"}];

    var opts='';
    q.opts.forEach(function(o,j){opts+='<button class="ob" id="o'+i+'_'+j+'" onclick="pick('+i+','+j+')"><span class="ol">'+L[j]+'</span><span>'+o+'</span></button>';});
    d.innerHTML='<div class="qh"><div class="qn">'+(i+1)+'</div><div class="qt">'+q.q+'</div></div><div class="opts">'+opts+'</div><div class="exp" id="ex'+i+'"><strong>✓ 解析：</strong>'+q.exp+'</div>';
    c.appendChild(d);
  });
}
function pick(qi,oi){
  if(done)return;A[qi]=oi;
  for(var j=0;j<4;j++){var b=document.getElementById('o'+qi+'_'+j);if(b){b.classList.remove('correct','wrong','reveal');b.style.cssText='';}}
  var s=document.getElementById('o'+qi+'_'+oi);if(s){s.style.cssText='border-color:#1a2744;background:#e8ecf8';}
  upd();
}
function upd(){
  var n=A.filter(function(a){return a!==null;}).length;
  document.getElementById('pb').style.width=(n/Q.length*100)+'%';
  document.getElementById('pbl').textContent=n+' / '+Q.length+' 已作答';
}
function doSub(){
  var un=A.filter(function(a){return a===null;}).length;
  if(un>0){var w=document.getElementById('wn');w.style.display='block';w.textContent='⚠ 还有 '+un+' 道题未作答，请完成后再提交。';return;}
  done=true;document.getElementById('wn').style.display='none';document.getElementById('subBtn').disabled=true;
  var ok=0;
  Q.forEach(function(q,i){
    var ua=A[i],ra=q.ans,good=(ua===ra);if(good)ok++;
    for(var j=0;j<4;j++){var b=document.getElementById('o'+i+'_'+j);if(b){b.style.cssText='';b.disabled=true;
      if(j===ra&&good&&j===ua){b.classList.add('correct');}
      else if(j===ua&&!good){b.classList.add('wrong');}
      else if(j===ra&&!good){b.classList.add('reveal');}
    }}
    if(!good){var e=document.getElementById('ex'+i);if(e)e.classList.add('show');}
  });
  var sc=Math.round(ok/Q.length*100);
  document.getElementById('scn').textContent=sc;
  document.getElementById('cc').textContent=ok;
  document.getElementById('wc').textContent=Q.length-ok;
  var t,s;
  if(sc>=90){t='🏆 非常出色！';s='羽绚，历史知识非常扎实，满分指日可待！继续努力！';}
  else if(sc>=75){t='🌟 做得很好！';s='羽绚，成绩优异！认真复习错题解析，下次会更棒！';}
  else if(sc>=60){t='👍 继续加油！';s='羽绚，基础不错！仔细阅读每道错题的解析，进步会更快！';}
  else{t='📖 再加把劲！';s='羽绚，不要气馁！认真读懂解析，再来一次，一定进步！';}
  document.getElementById('rtl').textContent=t;
  document.getElementById('rsb').textContent=s;
  document.getElementById('rp').classList.add('show');
  document.getElementById('rp').scrollIntoView({behavior:'smooth'});
}
function doReset(){
  A=new Array(Q.length).fill(null);done=false;
  document.getElementById('subBtn').disabled=false;
  document.getElementById('rp').classList.remove('show');
  document.getElementById('wn').style.display='none';
  build();upd();window.scrollTo({top:0,behavior:'smooth'});
}
build();upd();
</script></body></html>
