<script>
const Q=[{"q": "以下哪个州以米南加保双尖牛角屋顶建筑著称？", "opts": ["霹雳", "吉打", "森美兰（Negeri Sembilan）", "彭亨"], "ans": 2, "exp": "森美兰州受米南加保文化影响，以独特的双尖牛角屋顶（Rumah Minangkabau）传统建筑著称。"}, {"q": "制定国家原则三大原因中的社会因素是什么？", "opts": ["经济地位的落差", "居住地区的分化", "政治理念的不同", "宗教信仰差异"], "ans": 1, "exp": "制定国家原则的社会因素是居住地区的分化——各族群因历史经济原因分群聚居，彼此缺乏交流。"}, {"q": "马六甲王朝约于哪一年建立，使马六甲成为重要国际贸易港口？", "opts": ["约1300年", "约1400年", "约1500年", "约1600年"], "ans": 1, "exp": "马六甲王朝约建于1400年，使马六甲成为重要的国际贸易港口，后成为马来西亚历史最悠久的城市所在地。"}, {"q": "以下哪个是正确的国家原则顺序？", "opts": ["忠于君国、信奉上苍、维护宪法、尊崇法治、培养德行", "信奉上苍、忠于君国、维护宪法、尊崇法治、培养德行", "维护宪法、信奉上苍、忠于君国、尊崇法治、培养德行", "培养德行、尊崇法治、维护宪法、忠于君国、信奉上苍"], "ans": 1, "exp": "国家原则的正确顺序是：信奉上苍（1）、忠于君国（2）、维护宪法（3）、尊崇法治（4）、培养德行（5）。"}, {"q": "东姑阿都拉曼在成立马来西亚大典上高呼几声默迪卡？", "opts": ["三声", "五声", "七声", "九声"], "ans": 2, "exp": "课文图片说明记载：东姑阿都拉曼在宣布马来西亚成立的大典上高呼七声默迪卡。"}, {"q": "东马的两个州位于哪个大岛上？", "opts": ["苏门答腊", "爪哇", "婆罗洲（Borneo）", "苏拉威西"], "ans": 2, "exp": "沙巴和砂拉越位于婆罗洲岛（Borneo）北部，婆罗洲是世界第三大岛。"}, {"q": "纳闽（Labuan）联邦直辖区位于哪里？", "opts": ["马来半岛西海岸", "砂拉越沿海", "沙巴西海岸外的小岛", "柔佛海峡"], "ans": 2, "exp": "纳闽是位于沙巴西海岸外的小岛，1984年成为联邦直辖区，是马来西亚国际离岸金融中心（IOFC）。"}, {"q": "仄迪族多数居住在哪里，使用什么语言沟通？", "opts": ["槟城，淡米尔语", "马六甲，克里奥尔马来语（Melayu kreol）", "吉隆坡，英语", "新山，马来语"], "ans": 1, "exp": "课文指出，仄迪族多数居住在马六甲，沟通语是克里奥尔马来语（Melayu kreol）。"}, {"q": "马来西亚忠诚委员会（JSKM）成立于哪一天？", "opts": ["1961年5月27日", "1961年7月23日", "1962年1月17日", "1963年9月16日"], "ans": 1, "exp": "马来西亚忠诚委员会（JSKM）于1961年7月23日成立。"}, {"q": "沙巴龙古斯族以什么著名？", "opts": ["造船", "种植稻米", "手工艺品", "采集海产"], "ans": 2, "exp": "课文指出，龙古斯族住在内陆地区，以手工艺品闻名。"}, {"q": "课文中伊登参与国会下议院立法，体现了哪项国家原则？", "opts": ["信奉上苍", "忠于君国", "维护宪法", "尊崇法治"], "ans": 2, "exp": "课文举例（伊登）：参与国会下议院立法的工作，体现了维护宪法的精神。"}, {"q": "马来西亚半岛（西马）共有多少个州？", "opts": ["9个", "11个", "13个", "15个"], "ans": 1, "exp": "马来西亚半岛共有11个州：玻璃市、吉打、槟城、霹雳、吉兰丹、丁加奴、彭亨、雪兰莪、森美兰、马六甲和柔佛。"}, {"q": "国家原则共有多少项原则？", "opts": ["三项", "四项", "五项", "六项"], "ans": 2, "exp": "国家原则共有五项原则：信奉上苍、忠于君国、维护宪法、尊崇法治、培养德行。"}, {"q": "马来西亚最高峰京那巴鲁山位于哪个州？", "opts": ["砂拉越", "彭亨", "沙巴", "霹雳"], "ans": 2, "exp": "京那巴鲁山（Mount Kinabalu）海拔4,095米，位于沙巴州，是马来西亚最高峰。"}, {"q": "独立前印度族主要居住在哪里，从事什么经济活动？", "opts": ["市镇，经商", "园丘与市郊，园丘工作、小生意与码头工人", "内陆，农耕", "沿海，捕鱼"], "ans": 1, "exp": "课文指出，独立前，印度族住在园丘与市郊，从事园丘、小生意与码头工人的工作。"}, {"q": "峇峇娘惹使用什么语言沟通？", "opts": ["闽南语", "客家语", "峇峇语", "克里奥尔马来语"], "ans": 2, "exp": "课文指出，峇峇娘惹以峇峇语沟通，他们的生活方式与本地文化融合而成。"}, {"q": "马来半岛最南端的州是哪个，与新加坡隔海峡相望？", "opts": ["马六甲", "森美兰", "柔佛", "雪兰莪"], "ans": 2, "exp": "柔佛州（Johor）位于马来半岛最南端，与新加坡之间以柔佛海峡相隔。"}, {"q": "砂拉越沿海的马来族、马兰诺族和卡达央族从事什么经济活动？", "opts": ["种植稻米", "采集森林资源", "经商、造船和生产硕莪", "捕鱼和农耕"], "ans": 2, "exp": "课文指出，住在沿海的马来族、马兰诺族和卡达央族，从事经商、造船和生产硕莪的工作。"}, {"q": "峇峇娘惹的传统服装是什么？", "opts": ["旗袍和长衫", "纱丽和陀地", "绣花哥峇雅（kebaya bersulam）和峇迪沙笼（kain batik sarung）", "马来套装和马来男装"], "ans": 2, "exp": "课文指出，峇峇娘惹的传统服装是绣花哥峇雅（kebaya bersulam）和峇迪沙笼（kain batik sarung）。"}, {"q": "葛波委员会的报告显示砂拉越与沙巴人民对成立马来西亚的态度是什么？", "opts": ["全部反对", "半数支持半数反对", "三分之二的人民支持成立马来西亚", "全部支持"], "ans": 2, "exp": "葛波委员会的报告显示，三分之二的砂拉越与沙巴人民支持成立马来西亚。"}, {"q": "丹斯里拿督阿玛史蒂芬卡隆宁甘所属的政党是什么？", "opts": ["沙统（USNO）", "砂拉越保守党（PESAKA）", "砂拉越国民党（SNAP）", "马来民族统一机构（UMNO）"], "ans": 2, "exp": "丹斯里拿督阿玛史蒂芬卡隆宁甘是砂拉越国民党（SNAP）领袖。"}, {"q": "东姑阿都拉曼所属的政党是什么？", "opts": ["马华公会（MCA）", "马来民族统一机构（UMNO/巫统）", "新加坡人民行动党（PAP）", "砂拉越保守党（PESAKA）"], "ans": 1, "exp": "东姑阿都拉曼（Tunku Abdul Rahman Putra Al-Haj）是马来民族统一机构（UMNO/巫统）领袖。"}, {"q": "沙巴的首府是哪个城市？", "opts": ["古晋", "诗巫", "美里", "亚庇（Kota Kinabalu）"], "ans": 3, "exp": "亚庇（Kota Kinabalu）是沙巴州的首府，以京那巴鲁山著称。"}, {"q": "暹罗族分布在马来半岛的哪些州属？", "opts": ["霹雳、雪兰莪、柔佛、彭亨", "吉打、吉兰丹、玻璃市、槟城和霹雳", "沙巴、砂拉越、马六甲", "雪兰莪、吉隆坡、森美兰"], "ans": 1, "exp": "课文指出，暹罗族分布在吉打、吉兰丹、玻璃市、槟城和霹雳。"}, {"q": "第四任国家元首的名字是什么？", "opts": ["端姑阿都哈林", "端姑希沙慕丁", "苏丹依斯迈纳西鲁丁沙", "苏丹阿都拉"], "ans": 2, "exp": "颁布国家原则的第四任最高元首是苏丹依斯迈纳西鲁丁沙（Tuanku Sultan Ismail Nasiruddin Shah Ibni Almarhum Sultan Zainal Abidin）。"}, {"q": "国家原则培养了各族国民的哪三种精神？", "opts": ["竞争、进步、创新", "包容、合作与相互谅解的精神", "独立、自强、个人主义", "排外、保守、固步自封"], "ans": 1, "exp": "课文指出，国家原则培养了各族国民的包容、合作与相互谅解的精神。"}, {"q": "制定国家原则三大原因中的经济因素是什么？", "opts": ["居住地区的分化", "政治理念的不同", "经济地位的落差", "外国侵略威胁"], "ans": 2, "exp": "课文列出制定国家原则的三个原因：经济地位的落差（经济因素）、居住地区的分化（社会因素）、政治理念的不同（政治因素）。"}, {"q": "国家原则能引导人民远离什么威胁？", "opts": ["自然灾害", "外国侵略", "威胁治安的犯罪活动", "经济通货膨胀"], "ans": 2, "exp": "课文指出，国家原则能引导人民远离威胁我国治安的犯罪活动。"}, {"q": "1938年提出大马来由（Melayu Raya）概念的两位本地领袖是谁？", "opts": ["东姑阿都拉曼与敦阿都拉萨", "依布拉欣耶谷与哈仑阿米努拉昔", "李光耀与敦天猛公朱加巴里恩", "敦拿督慕斯达法哈仑与史蒂芬卡隆宁甘"], "ans": 1, "exp": "课文指出，1938年，依布拉欣耶谷（Ibrahim Haji Yaakob）和哈仑阿米努拉昔（Harun Aminurrashid）提出大马来由（Melayu Raya）的概念。"}, {"q": "马来半岛原住民分为哪三大族群？", "opts": ["伊班族、比达友族、马兰诺族", "尼格利陀族（塞芒族）、塞诺伊族、原始马来人", "卡达山族、龙古斯族、苏禄族", "华族、印度族、马来族"], "ans": 1, "exp": "课文指出，马来西亚半岛原住民分为三大族群：尼格利陀族（又称塞芒族）、塞诺伊族和原始马来人。"}, {"q": "只合并新加坡与马来亚联合邦会产生什么问题？", "opts": ["新加坡面积太小", "只合并新加坡会导致族群结构不平衡，必须加入砂拉越与沙巴", "新加坡经济太发达", "新加坡人口不足"], "ans": 1, "exp": "课文指出，只合并新加坡将导致族群结构不平衡；马来亚联合邦、砂拉越、沙巴与汶莱的合并才能平衡族群结构。"}, {"q": "UNMM代表哪个机构？", "opts": ["马来西亚忠诚委员会", "跨政府委员会", "葛波委员会", "联合国马来西亚任务调查团"], "ans": 3, "exp": "UNMM是United Nations Malaysia Mission（联合国马来西亚任务调查团）的缩写，负责核实砂拉越与沙巴人民参组马来西亚的意向。"}];

  Q.forEach(function(q,i){
    var d=document.createElement('div');d.className='qc';d.id='qc'+i;
    var opts='';
    q.opts.forEach(function(o,j){opts+='<button class="ob" id="o'+i+'_'+j+'" onclick="pick('+i+','+j+')"><span class="ol">'+L[j]+'</span><span>'+o+'</span></button>';});
    d.innerHTML='<div class="qh"><div class="qn">'+(i+1)+'</div><div class="qt">'+q.q+'</div></div><div class="opts">'+opts+'</div><div class="exp" id="ex'+i+'"><strong>✓ 解析：</strong>'+q.exp+'</div>';
    c.appendChild(d);
  });
}
function pick(qi,oi){
  if(done)return;A[qi]=oi;
  for(var j=0;j<4;j++){var b=document.getElementById('o'+qi+'_'+j);if(b){b.classList.remove('correct','wrong','reveal');b.style.cssText='';}}
  var s=document.getElementById('o'+qi+'_'+oi);if(s){s.style.cssText='border-color:#1a2744;background:#e8ecf8';}
  upd();
}
function upd(){
  var n=A.filter(function(a){return a!==null;}).length;
  document.getElementById('pb').style.width=(n/Q.length*100)+'%';
  document.getElementById('pbl').textContent=n+' / '+Q.length+' 已作答';
}
function doSub(){
  var un=A.filter(function(a){return a===null;}).length;
  if(un>0){var w=document.getElementById('wn');w.style.display='block';w.textContent='⚠ 还有 '+un+' 道题未作答，请完成后再提交。';return;}
  done=true;document.getElementById('wn').style.display='none';document.getElementById('subBtn').disabled=true;
  var ok=0;
  Q.forEach(function(q,i){
    var ua=A[i],ra=q.ans,good=(ua===ra);if(good)ok++;
    for(var j=0;j<4;j++){var b=document.getElementById('o'+i+'_'+j);if(b){b.style.cssText='';b.disabled=true;
      if(j===ra&&good&&j===ua){b.classList.add('correct');}
      else if(j===ua&&!good){b.classList.add('wrong');}
      else if(j===ra&&!good){b.classList.add('reveal');}
    }}
    if(!good){var e=document.getElementById('ex'+i);if(e)e.classList.add('show');}
  });
  var sc=Math.round(ok/Q.length*100);
  document.getElementById('scn').textContent=sc;
  document.getElementById('cc').textContent=ok;
  document.getElementById('wc').textContent=Q.length-ok;
  var t,s;
  if(sc>=90){t='🏆 非常出色！';s='羽绚，历史知识非常扎实，满分指日可待！继续努力！';}
  else if(sc>=75){t='🌟 做得很好！';s='羽绚，成绩优异！认真复习错题解析，下次会更棒！';}
  else if(sc>=60){t='👍 继续加油！';s='羽绚，基础不错！仔细阅读每道错题的解析，进步会更快！';}
  else{t='📖 再加把劲！';s='羽绚，不要气馁！认真读懂解析，再来一次，一定进步！';}
  document.getElementById('rtl').textContent=t;
  document.getElementById('rsb').textContent=s;
  document.getElementById('rp').classList.add('show');
  document.getElementById('rp').scrollIntoView({behavior:'smooth'});
}
function doReset(){
  A=new Array(Q.length).fill(null);done=false;
  document.getElementById('subBtn').disabled=false;
  document.getElementById('rp').classList.remove('show');
  document.getElementById('wn').style.display='none';
  build();upd();window.scrollTo({top:0,behavior:'smooth'});
}
build();upd();
</script></body></html>
