<script>
const Q=[{"q": "富有爱国精神的国民会尊重哪些国家象征？", "opts": ["政党旗帜", "城市标志", "国旗、国徽和国歌", "首相官邸"], "ans": 2, "exp": "课文指出，富有爱国精神的国民会效忠国家，尊重国家主权的象征如国旗、国徽和国歌。"}, {"q": "马六甲王朝约于哪一年建立，使马六甲成为重要国际贸易港口？", "opts": ["约1300年", "约1400年", "约1500年", "约1600年"], "ans": 1, "exp": "马六甲王朝约建于1400年，使马六甲成为重要的国际贸易港口，后成为马来西亚历史最悠久的城市所在地。"}, {"q": "颁布国家原则的是马来西亚第几任最高元首？", "opts": ["第二任", "第三任", "第四任", "第五任"], "ans": 2, "exp": "国家原则由第四任国家元首苏丹依斯迈纳西鲁丁沙颁布。"}, {"q": "我们应该如何看待成立马来西亚进程中的各方领袖？", "opts": ["批评他们的决策", "遗忘他们的付出", "珍惜他们的贡献与智慧", "质疑他们的动机"], "ans": 2, "exp": "课文明确指出：对于提出成立马来西亚概念的领袖，我们应该珍惜他们的贡献与智慧。"}, {"q": "马来西亚最高峰京那巴鲁山位于哪个州？", "opts": ["砂拉越", "彭亨", "沙巴", "霹雳"], "ans": 2, "exp": "京那巴鲁山（Mount Kinabalu）海拔4,095米，位于沙巴州，是马来西亚最高峰。"}, {"q": "色拉尼族（Serani）又称什么，是哪两个群体通婚的后代？", "opts": ["峇峇；中国商人与本地女性", "土生印度人；印度商人与本地女性", "欧亚裔；葡萄牙人与本地人", "暹罗人；泰族与马来人"], "ans": 2, "exp": "课文指出，色拉尼族（Serani）又称欧亚裔，是葡萄牙人和本地人通婚的后代。"}, {"q": "课文关于多元族群共处的核心结论是什么？", "opts": ["各族文化需要被改变", "各族群互相包容且和睦共处是马来西亚的特色，学习各族特色能培养爱国精神", "只需了解本族群特色", "不同族群之间无需了解彼此"], "ans": 1, "exp": "课文结语：各族群互相包容且和睦共处是马来西亚的特色，我们学习和分享各族群特色能够培养爱国精神。"}, {"q": "三个联邦直辖区按成立年份先后，正确顺序是？", "opts": ["纳闽（1984）、吉隆坡（1974）、布城（2001）", "吉隆坡（1974）、纳闽（1984）、布城（2001）", "布城（2001）、吉隆坡（1974）、纳闽（1984）", "三者同时成立"], "ans": 1, "exp": "吉隆坡于1974年成为第一个联邦直辖区，纳闽1984年，布城2001年，布城是最晚成立的。"}, {"q": "锡克族的母语是什么？", "opts": ["淡米尔语", "泰卢固语", "旁遮普语（bahasa Punjabi）", "克里斯坦语"], "ans": 2, "exp": "课文明确指出，锡克族的母语是旁遮普语（bahasa Punjabi）。"}, {"q": "以下哪个族群是沙巴最大的族群？", "opts": ["伊班族", "巴瑶族", "卡达山杜顺族", "龙古斯族"], "ans": 2, "exp": "课文指出，卡达山杜顺族是沙巴最大的族群，其中的族群分支拥有自己的语言。"}, {"q": "沙巴的首府是哪个城市？", "opts": ["古晋", "诗巫", "美里", "亚庇（Kota Kinabalu）"], "ans": 3, "exp": "亚庇（Kota Kinabalu）是沙巴州的首府，以京那巴鲁山著称。"}, {"q": "峇峇和娘惹是哪两个群体通婚的后代？", "opts": ["英国人与马来人", "来自中国的商人与马六甲当地女性", "印度商人与华族女性", "葡萄牙人与马来人"], "ans": 1, "exp": "课文指出，峇峇和娘惹是早期来自中国的商人和马六甲当地女性通婚的后代，男称峇峇，女称娘惹。"}, {"q": "跨政府委员会（JAK）的主要任务是什么？", "opts": ["进行民意调查", "制定保障砂拉越与沙巴权益的宪法草案", "举行公投", "签署协定"], "ans": 1, "exp": "跨政府委员会（Jawatankuasa Antara Kerajaan，JAK）的工作是制定保障砂拉越与沙巴权益的宪法草案。"}, {"q": "丹斯里拿督阿玛史蒂芬卡隆宁甘所属的政党是什么？", "opts": ["沙统（USNO）", "砂拉越保守党（PESAKA）", "砂拉越国民党（SNAP）", "马来民族统一机构（UMNO）"], "ans": 2, "exp": "丹斯里拿督阿玛史蒂芬卡隆宁甘是砂拉越国民党（SNAP）领袖。"}, {"q": "马来西亚联邦于哪一天正式成立？", "opts": ["1957年8月31日", "1963年7月9日", "1963年9月16日", "1965年8月9日"], "ans": 2, "exp": "马来西亚于1963年9月16日正式成立，宣布仪式在吉隆坡、古晋、亚庇和新加坡市政厅同时举行。"}, {"q": "国家原则必须成为马来西亚人民的什么？", "opts": ["娱乐指南", "生活指南", "经济指南", "政治指南"], "ans": 1, "exp": "课文明确指出，国家原则必须成为马来西亚人民的生活指南。"}, {"q": "国家原则共有多少项功能？", "opts": ["三项", "四项", "五项", "六项"], "ans": 3, "exp": "课文列出国家原则的六项功能：塑造有宗教信仰的社会、塑造富有爱国精神的社会、培养尊重法治的态度、巩固社会团结、贯彻道德价值观、塑造有高尚情操的社会。"}, {"q": "仄迪族（Chetti）是哪两个群体通婚的后代？", "opts": ["英国人与本地人", "来自中国的商人与当地女性", "来自印度的商人与本地女子", "葡萄牙人与马来人"], "ans": 2, "exp": "课文指出，仄迪族（Chetti）或土生印度人是来自印度的商人与本地女子通婚后所生的后代。"}, {"q": "忠于君国（Kesetiaan kepada Raja dan Negara）是国家原则第几项？", "opts": ["第一项", "第二项", "第三项", "第四项"], "ans": 1, "exp": "国家原则第二项是忠于君国（Kesetiaan kepada Raja dan Negara），强调对最高元首和国家的忠诚。"}, {"q": "通过国家原则，国人谅解和尊重不同族群的宗教和文化，体现了哪项功能？", "opts": ["培养尊重法治的态度", "巩固社会团结", "塑造有宗教信仰的社会", "贯彻道德价值观"], "ans": 1, "exp": "课文指出，通过国家原则，国人能谅解和尊重不同族群的宗教和文化，从而巩固社会团结。"}, {"q": "课文中吉塔一家人及邻居按各自宗教信仰为病父祈祷，体现了哪项国家原则？", "opts": ["信奉上苍", "忠于君国", "维护宪法", "尊崇法治"], "ans": 0, "exp": "课文举例（吉塔）：一家人和邻居按各自的宗教信仰为她发高烧的父亲祈祷，体现了信奉上苍及族群包容的精神。"}, {"q": "马来西亚忠诚委员会（JSKM）成立于哪一天？", "opts": ["1961年5月27日", "1961年7月23日", "1962年1月17日", "1963年9月16日"], "ans": 1, "exp": "马来西亚忠诚委员会（JSKM）于1961年7月23日成立。"}, {"q": "以下哪个州首府是怡保，是马来西亚第三大城市？", "opts": ["彭亨", "雪兰莪", "霹雳（Perak）", "丁加奴"], "ans": 2, "exp": "怡保（Ipoh）是霹雳州首府，是马来西亚第三大城市，以白咖啡和石灰岩地貌著名。"}, {"q": "东马的两个州位于哪个大岛上？", "opts": ["苏门答腊", "爪哇", "婆罗洲（Borneo）", "苏拉威西"], "ans": 2, "exp": "沙巴和砂拉越位于婆罗洲岛（Borneo）北部，婆罗洲是世界第三大岛。"}, {"q": "JSKM的马来文全称是什么？", "opts": ["Jawatankuasa Antara Kerajaan", "Jawatankuasa Setia Kawan Malaysia", "Suruhanjaya Cobbold", "Majlis Perundingan Negara"], "ans": 1, "exp": "JSKM是Jawatankuasa Setia Kawan Malaysia（马来西亚忠诚委员会）的缩写。"}, {"q": "独立前印度族主要居住在哪里，从事什么经济活动？", "opts": ["市镇，经商", "园丘与市郊，园丘工作、小生意与码头工人", "内陆，农耕", "沿海，捕鱼"], "ans": 1, "exp": "课文指出，独立前，印度族住在园丘与市郊，从事园丘、小生意与码头工人的工作。"}, {"q": "马来西亚由哪些主要族群组成？", "opts": ["只有马来族和华族", "马来族、华族、印度族、半岛原住民、伊班族、卡达山杜顺族等多元族群", "只有三大民族", "只有马来族"], "ans": 1, "exp": "课文指出，马来西亚各族群包括马来族、华族、印度族、半岛原住民、伊班族、马兰诺族、卡达山杜顺族、比达友族、巴瑶族和伊拉农族等。"}, {"q": "国家原则忠于君国中的君是指谁？", "opts": ["首相", "州苏丹", "最高元首（Yang di-Pertuan Agong）", "英国国王"], "ans": 2, "exp": "国家原则忠于君国中的君是指马来西亚最高元首（Yang di-Pertuan Agong）。"}, {"q": "马来西亚的三个联邦直辖区是哪三个？", "opts": ["吉隆坡、莎阿南、纳闽", "吉隆坡、布城、纳闽", "吉隆坡、布城、莎阿南", "布城、纳闽、怡保"], "ans": 1, "exp": "马来西亚的三个联邦直辖区是吉隆坡（Kuala Lumpur）、布城（Putrajaya）和纳闽（Labuan）。"}, {"q": "1938年提出大马来由（Melayu Raya）概念的两位本地领袖是谁？", "opts": ["东姑阿都拉曼与敦阿都拉萨", "依布拉欣耶谷与哈仑阿米努拉昔", "李光耀与敦天猛公朱加巴里恩", "敦拿督慕斯达法哈仑与史蒂芬卡隆宁甘"], "ans": 1, "exp": "课文指出，1938年，依布拉欣耶谷（Ibrahim Haji Yaakob）和哈仑阿米努拉昔（Harun Aminurrashid）提出大马来由（Melayu Raya）的概念。"}, {"q": "成立马来西亚进程中，在葛波委员会报告之后才发生的步骤是什么？", "opts": ["东姑阿都拉曼在艾德菲酒店提出概念", "成立JSKM忠诚委员会", "成立JAK跨政府委员会及新加坡公投", "东姑阿都拉曼访问砂拉越"], "ans": 2, "exp": "根据课文时间线，葛波委员会于1962年6月21日移交报告，之后才成立JAK（1962年8月30日）并举行新加坡公投。"}, {"q": "纳闽（Labuan）联邦直辖区位于哪里？", "opts": ["马来半岛西海岸", "砂拉越沿海", "沙巴西海岸外的小岛", "柔佛海峡"], "ans": 2, "exp": "纳闽是位于沙巴西海岸外的小岛，1984年成为联邦直辖区，是马来西亚国际离岸金融中心（IOFC）。"}];

    var d=document.createElement('div');d.className='qc';d.id='qc'+i;
    var opts='';
    q.opts.forEach(function(o,j){opts+='<button class="ob" id="o'+i+'_'+j+'" onclick="pick('+i+','+j+')"><span class="ol">'+L[j]+'</span><span>'+o+'</span></button>';});
    d.innerHTML='<div class="qh"><div class="qn">'+(i+1)+'</div><div class="qt">'+q.q+'</div></div><div class="opts">'+opts+'</div><div class="exp" id="ex'+i+'"><strong>✓ 解析：</strong>'+q.exp+'</div>';
    c.appendChild(d);
  });
}
function pick(qi,oi){
  if(done)return;A[qi]=oi;
  for(var j=0;j<4;j++){var b=document.getElementById('o'+qi+'_'+j);if(b){b.classList.remove('correct','wrong','reveal');b.style.cssText='';}}
  var s=document.getElementById('o'+qi+'_'+oi);if(s){s.style.cssText='border-color:#1a2744;background:#e8ecf8';}
  upd();
}
function upd(){
  var n=A.filter(function(a){return a!==null;}).length;
  document.getElementById('pb').style.width=(n/Q.length*100)+'%';
  document.getElementById('pbl').textContent=n+' / '+Q.length+' 已作答';
}
function doSub(){
  var un=A.filter(function(a){return a===null;}).length;
  if(un>0){var w=document.getElementById('wn');w.style.display='block';w.textContent='⚠ 还有 '+un+' 道题未作答，请完成后再提交。';return;}
  done=true;document.getElementById('wn').style.display='none';document.getElementById('subBtn').disabled=true;
  var ok=0;
  Q.forEach(function(q,i){
    var ua=A[i],ra=q.ans,good=(ua===ra);if(good)ok++;
    for(var j=0;j<4;j++){var b=document.getElementById('o'+i+'_'+j);if(b){b.style.cssText='';b.disabled=true;
      if(j===ra&&good&&j===ua){b.classList.add('correct');}
      else if(j===ua&&!good){b.classList.add('wrong');}
      else if(j===ra&&!good){b.classList.add('reveal');}
    }}
    if(!good){var e=document.getElementById('ex'+i);if(e)e.classList.add('show');}
  });
  var sc=Math.round(ok/Q.length*100);
  document.getElementById('scn').textContent=sc;
  document.getElementById('cc').textContent=ok;
  document.getElementById('wc').textContent=Q.length-ok;
  var t,s;
  if(sc>=90){t='🏆 非常出色！';s='羽绚，历史知识非常扎实，满分指日可待！继续努力！';}
  else if(sc>=75){t='🌟 做得很好！';s='羽绚，成绩优异！认真复习错题解析，下次会更棒！';}
  else if(sc>=60){t='👍 继续加油！';s='羽绚，基础不错！仔细阅读每道错题的解析，进步会更快！';}
  else{t='📖 再加把劲！';s='羽绚，不要气馁！认真读懂解析，再来一次，一定进步！';}
  document.getElementById('rtl').textContent=t;
  document.getElementById('rsb').textContent=s;
  document.getElementById('rp').classList.add('show');
  document.getElementById('rp').scrollIntoView({behavior:'smooth'});
}
function doReset(){
  A=new Array(Q.length).fill(null);done=false;
  document.getElementById('subBtn').disabled=false;
  document.getElementById('rp').classList.remove('show');
  document.getElementById('wn').style.display='none';
  build();upd();window.scrollTo({top:0,behavior:'smooth'});
}
build();upd();
</script></body></html>
