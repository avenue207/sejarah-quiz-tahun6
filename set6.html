*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

.nav a:hover,.nav a.active{background:var(--gd);color:var(--nv);border-color:var(--gd);font-weight:700}

.ob{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--bd);border-radius:7px;padding:.58rem .8rem;cursor:pointer;font-family:'Noto Sans SC',sans-serif;font-size:13.5px;text-align:left;transition:border-color .15s,background .15s;color:var(--ink)}
.ob:hover:not(:disabled){border-color:var(--nv);background:#e8ecf8}

.ob.correct{border-color:var(--gnb);background:var(--gnl)}.ob.correct .ol{background:var(--gn)}
.ob.wrong{border-color:var(--rdb);background:var(--rdl)}.ob.wrong .ol{background:var(--rd)}
.ob.reveal{border-color:var(--gnb);background:var(--gnl);opacity:.72}.ob.reveal .ol{background:var(--gn)}
.exp{display:none;margin-top:.75rem;background:#fff8e1;border-left:4px solid var(--gd);border-radius:0 7px 7px 0;padding:.6rem .85rem;font-size:13px;line-height:1.65;color:#5a4a1a}
.exp.show{display:block}.exp strong{color:var(--nv)}
.ssec{text-align:center;margin:1.6rem 0}
#subBtn{background:var(--nv);color:#fff;font-family:'Noto Sans SC',sans-serif;font-size:15px;font-weight:700;padding:.78rem 2.4rem;border:none;border-radius:99px;cursor:pointer;letter-spacing:.07em;transition:background .2s}
#subBtn:hover{background:#253560}#subBtn:active{transform:scale(.97)}#subBtn:disabled{background:#aaa;cursor:not-allowed}
.warn{display:none;color:var(--rd);font-size:12px;margin-top:.4rem}
.rp{display:none;background:var(--wh);border:2px solid var(--nv);border-radius:14px;padding:1.8rem 1.4rem;text-align:center;margin:1.5rem 0}

.sc{width:106px;height:106px;border-radius:50%;background:var(--nv);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto .85rem;border:4px solid var(--gd)}

<script>
const Q=[{"q": "马来西亚国家石油公司双子塔（Petronas Twin Towers）于哪一年落成？", "opts": ["1995年", "1996年", "1998年", "2000年"], "ans": 2, "exp": "马来西亚国家石油双子塔（Petronas Twin Towers）于1998年落成，曾是世界上最高的建筑物。"}, {"q": "以下哪个州以米南加保双尖牛角屋顶建筑著称？", "opts": ["霹雳", "吉打", "森美兰（Negeri Sembilan）", "彭亨"], "ans": 2, "exp": "森美兰州受米南加保文化影响，以独特的双尖牛角屋顶（Rumah Minangkabau）传统建筑著称。"}, {"q": "马来西亚的多媒体超级走廊（MSC Malaysia）成立于哪一年，主要目的是什么？", "opts": ["1990年，发展农业", "1994年，发展旅游业", "1996年，发展信息科技产业", "2000年，发展制造业"], "ans": 2, "exp": "多媒体超级走廊（MSC Malaysia）于1996年设立，是马来西亚发展信息科技（ICT）产业的核心地区。"}, {"q": "伊斯兰教的礼拜场所称为什么？", "opts": ["庙宇（Kuil）", "教堂（Gereja）", "清真寺（Masjid）", "神庙（Tokong）"], "ans": 2, "exp": "伊斯兰教的礼拜场所称为清真寺（Masjid），是穆斯林进行礼拜和宗教活动的神圣场所。"}, {"q": "以下哪位被称为马来西亚良知（Bapa Perpaduan）、第三任首相？", "opts": ["敦拉萨", "敦马哈迪", "敦胡先翁", "阿都拉巴达威"], "ans": 2, "exp": "敦胡先翁（Tun Hussein Onn）是马来西亚第三任首相（1976–1981年），以廉洁著称，被誉为国家统一之父。"}, {"q": "制定国家原则的直接历史背景是什么事件？", "opts": ["马来西亚成立", "1957年独立", "1969年5月13日事件", "日本占领马来亚"], "ans": 2, "exp": "1969年5月13日事件之后，国家行动理事会负责管制马来西亚，国家原则就是在那时制定的。"}, {"q": "马来西亚曲棍球队曾多次获得哪个亚洲冠军赛的冠军？", "opts": ["亚运会曲棍球金牌", "亚洲曲棍球锦标赛", "东运会曲棍球金牌", "英联邦运动会曲棍球金牌"], "ans": 1, "exp": "马来西亚曲棍球队曾多次获得亚洲曲棍球锦标赛冠军，是亚洲最强的曲棍球队之一。"}, {"q": "1938年提出大马来由（Melayu Raya）概念的是哪两位领袖？", "opts": ["东姑阿都拉曼与李光耀", "依布拉欣耶谷与哈仑阿米努拉昔", "敦阿都拉萨与敦天猛公朱加巴里恩", "葛波勋爵与马尔科姆麦克唐纳"], "ans": 1, "exp": "1938年，依布拉欣耶谷（Ibrahim Haji Yaakob）和哈仑阿米努拉昔（Harun Aminurrashid）提出大马来由（Melayu Raya）的概念。"}, {"q": "马来西亚风筝（Wau）在哪个州最为著名，是哪个族群的传统文化？", "opts": ["雪兰莪，华族", "吉兰丹，马来族", "霹雳，印度族", "槟城，峇峇娘惹"], "ans": 1, "exp": "马来风筝（Wau）在吉兰丹州最为著名，是马来族的传统文化，以月形风筝（Wau Bulan）最具代表性。"}, {"q": "色拉尼族最著名的两种舞蹈是什么？", "opts": ["玛咏舞和萨平舞", "布兰乐舞（branyo）和法拉佩拉舞（frapeirra）", "狮子舞和龙舞", "苏马绍舞和社旺舞"], "ans": 1, "exp": "课文指出，色拉尼族最著名的舞蹈是布兰乐舞（branyo）和法拉佩拉舞（frapeirra）。"}, {"q": "Negeri Sembilan在马来语中意思是什么？", "opts": ["七个州", "八个州", "九个州", "十个州"], "ans": 2, "exp": "Negeri Sembilan意为九个州（Nine States），由米南加保人建立的九个小酋长国合并而成。"}, {"q": "各族群的文化特色需要大家如何对待？", "opts": ["可以遗忘", "改变以同化", "珍惜各族群的文化特色才能发扬光大", "只保留主流文化"], "ans": 2, "exp": "课文指出，各族群的文化特色需要大家的珍惜，才能发扬光大，体现了文化多元共存的精神。"}, {"q": "国家原则于哪一天颁布？", "opts": ["1957年8月31日", "1963年9月16日", "1969年5月13日", "1970年8月31日"], "ans": 3, "exp": "国家原则于1970年8月31日，在马来西亚庆祝独立13周年纪念日时正式颁布。"}, {"q": "东姑阿都拉曼（Tunku Abdul Rahman）被誉为什么？", "opts": ["马来西亚经济之父", "马来西亚国父", "马来西亚教育之父", "马来西亚独立运动先驱"], "ans": 1, "exp": "东姑阿都拉曼被誉为马来西亚国父（Bapa Malaysia），他领导马来亚独立并成为马来西亚第一任首相。"}, {"q": "华族女性的传统服装是什么，以什么材料制成？", "opts": ["纱丽，棉布", "马来套装，丝绸", "旗袍，多数以柔软的丝绸制成", "绣花哥峇雅，蜡染布"], "ans": 2, "exp": "课文指出，华族女性的传统服装是旗袍，男性的是长衫，这些服装多数以柔软的丝绸制成。"}, {"q": "哈芝节（Hari Raya Aidiladha）是哪种宗教的节日，有什么重要宗教意义？", "opts": ["佛教，纪念佛陀成道", "印度教，庆祝稻米丰收", "伊斯兰教，纪念先知易卜拉欣的献祭精神", "基督教，纪念耶稣复活"], "ans": 2, "exp": "哈芝节（Hari Raya Aidiladha）是伊斯兰教重要节日，也称忠孝节，纪念先知易卜拉欣愿意献祭的精神，并与麦加朝圣（Haji）同期庆祝。"}, {"q": "敦马哈迪提出宏愿2020（Wawasan 2020）的目标是什么？", "opts": ["成为东盟最大军事强国", "到2020年将马来西亚建设成为完全发展的工业国", "成为全球最大橡胶出口国", "使马来西亚人口达到1亿"], "ans": 1, "exp": "宏愿2020（Wawasan 2020）由敦马哈迪于1991年提出，目标是到2020年将马来西亚建设成为完全发展的工业国。"}, {"q": "1998年马来西亚在吉隆坡举办了哪个重要的国际综合运动会？", "opts": ["奥运会", "世界运动会", "英联邦运动会（Commonwealth Games）", "亚运会"], "ans": 2, "exp": "马来西亚于1998年在吉隆坡举办英联邦运动会（Commonwealth Games），是马来西亚首次主办这一大型国际综合运动会。"}, {"q": "佛教的礼拜场所称为什么？", "opts": ["清真寺", "教堂", "印度庙", "佛教寺庙（Tokong/Kuil Buddha）"], "ans": 3, "exp": "佛教的礼拜场所称为佛教寺庙（Tokong或Kuil Buddha），华裔信徒在此进行礼佛和宗教活动。"}, {"q": "马六甲和槟城乔治市于哪一年被UNESCO列为世界文化遗产？", "opts": ["2000年", "2005年", "2008年", "2010年"], "ans": 2, "exp": "马六甲与槟城乔治市于2008年7月7日被联合国教科文组织（UNESCO）列为世界文化遗产城市。"}, {"q": "维护宪法（Keluhuran Perlembagaan）是国家原则第几项？", "opts": ["第一项", "第二项", "第三项", "第四项"], "ans": 2, "exp": "国家原则第三项是维护宪法（Keluhuran Perlembagaan），强调尊重联邦宪法的崇高地位。"}, {"q": "敦阿都拉萨推行了什么重要政策？", "opts": ["看东方政策", "新经济政策（DEB）", "国家文化政策", "宏愿2020"], "ans": 1, "exp": "敦阿都拉萨推行新经济政策（Dasar Ekonomi Baru，DEB），目标是消除贫穷和重组社会，任期1971–1990年。"}, {"q": "马来西亚的国家领袖在国家发展中最重要的贡献是什么？", "opts": ["增加国防开支", "通过协商与合作促进国家团结与发展", "推动单一民族政策", "加强与外国的军事联盟"], "ans": 1, "exp": "马来西亚国家领袖最重要的贡献是通过协商与合作，促进各族团结与国家发展，为人民谋求福祉。"}, {"q": "国家原则共有多少项原则？", "opts": ["三项", "四项", "五项", "六项"], "ans": 2, "exp": "国家原则共有五项原则：信奉上苍、忠于君国、维护宪法、尊崇法治、培养德行。"}, {"q": "马来族以哪种语言沟通，信奉哪种宗教？", "opts": ["华语，佛教", "淡米尔语，印度教", "马来语，伊斯兰教", "英语，基督教"], "ans": 2, "exp": "课文指出，马来族以马来语沟通、遵守马来传统习俗并信奉伊斯兰教。"}, {"q": "嘉华节（Gawai）是砂拉越哪个族群的重要节日？", "opts": ["卡达山杜顺族", "马兰诺族", "伊班族（达雅族）", "比达友族"], "ans": 2, "exp": "嘉华节（Gawai）是砂拉越达雅族（尤其是伊班族）最重要的节日，于每年6月1日庆祝稻米丰收。"}, {"q": "葛波委员会（Suruhanjaya Cobbold）成立于哪一天？", "opts": ["1961年7月23日", "1962年1月17日", "1962年6月21日", "1963年7月9日"], "ans": 1, "exp": "葛波委员会于1962年1月17日成立，目的是收集砂拉越与沙巴的民意。"}, {"q": "彭亨州最著名的国家公园是什么？", "opts": ["百乐公园", "塔曼尼加拉国家公园", "京那巴鲁国家公园", "砂拉越洞穴公园"], "ans": 1, "exp": "彭亨州拥有著名的塔曼尼加拉国家公园（Taman Negara），是全球最古老的热带雨林之一。"}, {"q": "马来西亚节庆文化的最重要特点是什么？", "opts": ["只有马来族节日最重要", "各族节日彼此竞争", "各族节日丰富多彩，体现多元文化和谐共存", "只庆祝国际节日"], "ans": 2, "exp": "马来西亚节庆文化最重要的特点是各族节日丰富多彩，各族在庆祝自身节日的同时互相尊重，体现多元文化和谐共存的精神。"}, {"q": "敦天猛公朱加巴里恩所属政党是什么？", "opts": ["沙统（USNO）", "砂拉越国民党（SNAP）", "砂拉越保守党（PESAKA）", "马来民族统一机构（UMNO）"], "ans": 2, "exp": "敦天猛公朱加巴里恩是砂拉越保守党（PESAKA）领袖，也是JSKM成员，并代表砂拉越签署《马来西亚协定》。"}, {"q": "马来西亚联邦于哪一天正式成立？", "opts": ["1957年8月31日", "1963年7月9日", "1963年9月16日", "1965年8月9日"], "ans": 2, "exp": "马来西亚于1963年9月16日正式成立，宣布仪式在吉隆坡、砂拉越古晋、沙巴亚庇和新加坡市政厅同时举行。"}, {"q": "基督教的礼拜场所称为什么？", "opts": ["清真寺", "印度庙", "教堂（Gereja）", "佛寺"], "ans": 2, "exp": "基督教的礼拜场所称为教堂（Gereja），是基督徒进行礼拜、祈祷和宗教活动的场所。"}];
let A=new Array(Q.length).fill(null),done=false;
const L=['A','B','C','D'];
function build(){
  var c=document.getElementById('qctr');c.innerHTML='';
  Q.forEach(function(q,i){
    var d=document.createElement('div');d.className='qc';d.id='qc'+i;
    var opts='';
    q.opts.forEach(function(o,j){opts+='<button class="ob" id="o'+i+'_'+j+'" onclick="pick('+i+','+j+')"><span class="ol">'+L[j]+'</span><span>'+o+'</span></button>';});
    d.innerHTML='<div class="qh"><div class="qn">'+(i+1)+'</div><div class="qt">'+q.q+'</div></div><div class="opts">'+opts+'</div><div class="exp" id="ex'+i+'"><strong>✓ 解析：</strong>'+q.exp+'</div>';
    c.appendChild(d);
  });
}
function pick(qi,oi){
  if(done)return;A[qi]=oi;
  for(var j=0;j<4;j++){var b=document.getElementById('o'+qi+'_'+j);if(b){b.classList.remove('correct','wrong','reveal');b.style.cssText='';}}
  var s=document.getElementById('o'+qi+'_'+oi);if(s){s.style.cssText='border-color:#1a2744;background:#e8ecf8';}
  upd();
}
function upd(){
  var n=A.filter(function(a){return a!==null;}).length;
  document.getElementById('pb').style.width=(n/Q.length*100)+'%%';
  document.getElementById('pbl').textContent=n+' / '+Q.length+' 已作答';
}
function doSub(){
  var un=A.filter(function(a){return a===null;}).length;
  if(un>0){var w=document.getElementById('wn');w.style.display='block';w.textContent='⚠ 还有 '+un+' 道题未作答，请完成后再提交。';return;}
  done=true;document.getElementById('wn').style.display='none';document.getElementById('subBtn').disabled=true;
  var ok=0;
  Q.forEach(function(q,i){
    var ua=A[i],ra=q.ans,good=(ua===ra);if(good)ok++;
    for(var j=0;j<4;j++){var b=document.getElementById('o'+i+'_'+j);if(b){b.style.cssText='';b.disabled=true;
      if(j===ra&&good&&j===ua){b.classList.add('correct');}
      else if(j===ua&&!good){b.classList.add('wrong');}
      else if(j===ra&&!good){b.classList.add('reveal');}
    }}
    if(!good){var e=document.getElementById('ex'+i);if(e)e.classList.add('show');}
  });
  var sc=Math.round(ok/Q.length*100);
  document.getElementById('scn').textContent=sc;
  document.getElementById('cc').textContent=ok;
  document.getElementById('wc').textContent=Q.length-ok;
  var t,s;
  if(sc>=90){t='🏆 非常出色！';s='羽绚，历史知识非常扎实，满分指日可待！继续努力！';}
  else if(sc>=75){t='🌟 做得很好！';s='羽绚，成绩优异！认真复习错题解析，下次会更棒！';}
  else if(sc>=60){t='👍 继续加油！';s='羽绚，基础不错！仔细阅读每道错题的解析，进步会更快！';}
  else{t='📖 再加把劲！';s='羽绚，不要气馁！认真读懂解析，再来一次，一定进步！';}
  document.getElementById('rtl').textContent=t;
  document.getElementById('rsb').textContent=s;
  document.getElementById('rp').classList.add('show');
  document.getElementById('rp').scrollIntoView({behavior:'smooth'});
}
function doReset(){
  A=new Array(Q.length).fill(null);done=false;
  document.getElementById('subBtn').disabled=false;
  document.getElementById('rp').classList.remove('show');
  document.getElementById('wn').style.display='none';
  build();upd();window.scrollTo({top:0,behavior:'smooth'});
}
build();upd();
</script></body></html>
