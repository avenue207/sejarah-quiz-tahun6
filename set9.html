body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

.ob.reveal{border-color:var(--gnb);background:var(--gnl);opacity:.72}.ob.reveal .ol{background:var(--gn)}

<script>
const Q=[{"q": "以下哪个州以米南加保双尖牛角屋顶建筑著称？", "opts": ["霹雳", "吉打", "森美兰（Negeri Sembilan）", "彭亨"], "ans": 2, "exp": "森美兰州受米南加保文化影响，以独特的双尖牛角屋顶（Rumah Minangkabau）传统建筑著称。"}, {"q": "国家原则于哪一天颁布？", "opts": ["1957年8月31日", "1963年9月16日", "1969年5月13日", "1970年8月31日"], "ans": 3, "exp": "国家原则于1970年8月31日，在马来西亚庆祝独立13周年纪念日时正式颁布。"}, {"q": "Negeri Sembilan在马来语中意思是什么？", "opts": ["七个州", "八个州", "九个州", "十个州"], "ans": 2, "exp": "Negeri Sembilan在马来语中意为九个州（Nine States），由米南加保人建立的九个小酋长国合并而成。"}, {"q": "仄迪族多数居住在哪里，使用什么语言沟通？", "opts": ["槟城，淡米尔语", "马六甲，克里奥尔马来语（Melayu kreol）", "吉隆坡，英语", "新山，马来语"], "ans": 1, "exp": "课文指出，仄迪族多数居住在马六甲，沟通语是克里奥尔马来语（Melayu kreol）。"}, {"q": "布拉西勋爵的职务是什么？", "opts": ["英国驻东南亚高级总督", "英国北婆罗洲公司董事", "葛波委员会主席", "马来亚联合邦首席部长"], "ans": 1, "exp": "课文记载，提出1887年合并建议的是英国北婆罗洲公司董事布拉西勋爵（Lord Brassey）。"}, {"q": "马来西亚面积最大的州是哪个？", "opts": ["沙巴", "砂拉越", "彭亨", "柔佛"], "ans": 1, "exp": "砂拉越（Sarawak）是马来西亚面积最大的州，位于婆罗洲岛北部，约占马来西亚总面积的37%。"}, {"q": "课文中马蒂雅娜主动扶老婆婆过马路，体现了哪项国家原则？", "opts": ["信奉上苍", "忠于君国", "维护宪法", "培养德行"], "ans": 3, "exp": "课文举例（马蒂雅娜）：主动扶老婆婆过马路，体现了培养德行的精神。"}, {"q": "只合并新加坡与马来亚联合邦会产生什么问题？", "opts": ["新加坡面积太小", "只合并新加坡会导致族群结构不平衡，必须加入砂拉越与沙巴", "新加坡经济太发达", "新加坡人口不足"], "ans": 1, "exp": "课文指出，只合并新加坡将导致族群结构不平衡；马来亚联合邦、砂拉越、沙巴与汶莱的合并才能平衡族群结构。"}, {"q": "成立马来西亚能保障国家安全的原因是什么？", "opts": ["促进基础建设发展", "共产党威胁新加坡与砂拉越的治安", "平衡各族人口比例", "加快脱离殖民统治"], "ans": 1, "exp": "课文指出，共产党威胁新加坡和砂拉越的治安，成立马来西亚能抵御共产党的威胁，属于保障国家安全的原因。"}, {"q": "富有爱国精神的国民会尊重哪些国家象征？", "opts": ["政党旗帜", "城市标志", "国旗、国徽和国歌", "首相官邸"], "ans": 2, "exp": "课文指出，富有爱国精神的国民会效忠国家，尊重国家主权的象征如国旗、国徽和国歌。"}, {"q": "UNMM代表哪个机构？", "opts": ["马来西亚忠诚委员会", "跨政府委员会", "葛波委员会", "联合国马来西亚任务调查团"], "ans": 3, "exp": "UNMM是United Nations Malaysia Mission（联合国马来西亚任务调查团）的缩写，负责核实砂拉越与沙巴人民参组马来西亚的意向。"}, {"q": "马来半岛北部与哪个国家接壤？", "opts": ["印度尼西亚", "新加坡", "泰国", "越南"], "ans": 2, "exp": "马来西亚半岛北部与泰国接壤，玻璃市和吉打是与泰国接壤的最北端州属。"}, {"q": "以下哪个族群是沙巴最大的族群？", "opts": ["伊班族", "巴瑶族", "卡达山杜顺族", "龙古斯族"], "ans": 2, "exp": "课文指出，卡达山杜顺族是沙巴最大的族群，其中的族群分支拥有自己的语言。"}, {"q": "马来族以哪种语言沟通，信奉哪种宗教？", "opts": ["华语，佛教", "淡米尔语，印度教", "马来语，伊斯兰教", "英语，基督教"], "ans": 2, "exp": "课文指出，马来族以马来语沟通、遵守马来传统习俗并信奉伊斯兰教。"}, {"q": "马来族女性的传统服装名称是什么？", "opts": ["旗袍", "纱丽", "马来套装（baju kurung）", "绣花哥峇雅"], "ans": 2, "exp": "课文指出，马来族传统服装以女性马来套装（baju kurung）和男性马来男装（baju Melayu）为大家所熟悉。"}, {"q": "彭亨州最著名的国家公园是什么？", "opts": ["百乐公园", "塔曼尼加拉国家公园（Taman Negara）", "京那巴鲁国家公园", "砂拉越洞穴公园"], "ans": 1, "exp": "彭亨州拥有著名的塔曼尼加拉国家公园（Taman Negara），是全球最古老的热带雨林之一。"}, {"q": "国家原则共有多少项原则？", "opts": ["三项", "四项", "五项", "六项"], "ans": 2, "exp": "国家原则共有五项原则：信奉上苍、忠于君国、维护宪法、尊崇法治、培养德行。"}, {"q": "马来族男性的传统服装名称是什么？", "opts": ["长衫", "陀地（doti）", "旗袍", "马来男装（baju Melayu）"], "ans": 3, "exp": "课文指出，马来族男性的传统服装是马来男装（baju Melayu）。"}, {"q": "独立后各族居住模式发生了什么变化？", "opts": ["各族仍然分群居住", "各族群分群居住问题已获解决，族群间包容精神促使他们一起工作、同住一处", "各族间冲突加剧", "政府强制各族搬迁"], "ans": 1, "exp": "课文指出，独立与成立马来西亚后，各族群分群居住问题已获解决，族群间包容精神促使他们一起工作。"}, {"q": "成立马来西亚最初的概念包括哪五个地方？", "opts": ["马来亚联合邦、砂拉越、沙巴与新加坡", "马来亚联合邦、砂拉越、沙巴、新加坡与汶莱", "马来亚联合邦与砂拉越", "砂拉越、沙巴与新加坡"], "ans": 1, "exp": "成立马来西亚最初的概念包括马来亚联合邦、砂拉越、沙巴、新加坡与汶莱五个地方，但汶莱最终没有加入。"}, {"q": "峇峇和娘惹是哪两个群体通婚的后代？", "opts": ["英国人与马来人", "来自中国的商人与马六甲当地女性", "印度商人与华族女性", "葡萄牙人与马来人"], "ans": 1, "exp": "课文指出，峇峇和娘惹是早期来自中国的商人和马六甲当地女性通婚的后代，男称峇峇，女称娘惹。"}, {"q": "课文指出成立马来西亚给予我们什么历史教诲？", "opts": ["军事力量最重要", "各方的真诚、同理心和协商精神为我国带来繁荣与昌盛", "经济实力决定一切", "单一族群才能建国"], "ans": 1, "exp": "课文总结：马来西亚的成立给予我们许多历史教诲，各方的真诚、同理心和协商精神，为我国带来繁荣与昌盛。"}, {"q": "成立马来西亚进程中，在葛波委员会报告之后才发生的步骤是什么？", "opts": ["东姑阿都拉曼在艾德菲酒店提出概念", "成立JSKM忠诚委员会", "成立JAK跨政府委员会及新加坡公投", "东姑阿都拉曼访问砂拉越"], "ans": 2, "exp": "根据课文时间线，葛波委员会于1962年6月21日移交报告，之后才成立JAK（1962年8月30日）并举行新加坡公投。"}, {"q": "正直的操守会影响我们在哪些方面的表现？", "opts": ["只影响政治", "在教育、事业和生活中的表现", "只影响经济", "只影响体育"], "ans": 1, "exp": "课文指出，正直的操守会影响我们在教育、事业和生活中的表现。"}, {"q": "国家原则由哪个机构的委员会制定？", "opts": ["国会", "内阁特别委员会", "国家咨询理事会（MAPEN）属下的国家原则委员会", "最高元首御前会议"], "ans": 2, "exp": "国家原则于1970年3月4日由国家咨询理事会（MAPEN）属下的国家原则委员会所制定。"}, {"q": "以下哪个州首府是新山（Johor Bahru），与新加坡隔海相望？", "opts": ["马六甲", "雪兰莪", "柔佛（Johor）", "森美兰"], "ans": 2, "exp": "柔佛州（Johor）首府新山（Johor Bahru），与新加坡隔柔佛海峡相望。"}, {"q": "马来亚联合邦与新加坡的协商发生在哪一天？", "opts": ["1962年1月17日", "1962年8月30日", "1963年7月9日", "1963年9月16日"], "ans": 1, "exp": "根据课文时间线，1962年8月30日马来亚联合邦与新加坡进行协商。"}, {"q": "国家原则的宗旨是什么？", "opts": ["增加国防开支", "培养团结且具包容态度的国民，是促进忠诚与爱国精神的指南", "促进对外贸易", "提高国民生产总值"], "ans": 1, "exp": "课文指出，国家原则旨在培养团结且具包容态度的国民，是促进忠诚与爱国精神的指南。"}, {"q": "砂拉越沿海的马来族、马兰诺族和卡达央族从事什么经济活动？", "opts": ["种植稻米", "采集森林资源", "经商、造船和生产硕莪", "捕鱼和农耕"], "ans": 2, "exp": "课文指出，住在沿海的马来族、马兰诺族和卡达央族，从事经商、造船和生产硕莪的工作。"}, {"q": "以下哪个州位于马来半岛最北端，面积最小，与泰国接壤？", "opts": ["吉打", "吉兰丹", "槟城", "玻璃市（Perlis）"], "ans": 3, "exp": "玻璃市（Perlis）是马来西亚13个州中面积最小的州，位于马来半岛最北端，与泰国直接接壤。"}, {"q": "马来西亚共有多少个州和联邦直辖区？", "opts": ["11州2联邦直辖区", "12州3联邦直辖区", "13州3联邦直辖区", "14州2联邦直辖区"], "ans": 2, "exp": "马来西亚由13个州和3个联邦直辖区（吉隆坡、布城、纳闽）共16个行政区划组成。"}, {"q": "通过国家原则，国人谅解和尊重不同族群的宗教和文化，体现了哪项功能？", "opts": ["培养尊重法治的态度", "巩固社会团结", "塑造有宗教信仰的社会", "贯彻道德价值观"], "ans": 1, "exp": "课文指出，通过国家原则，国人能谅解和尊重不同族群的宗教和文化，从而巩固社会团结。"}];
let A=new Array(Q.length).fill(null),done=false;
const L=['A','B','C','D'];
function build(){
  var c=document.getElementById('qctr');c.innerHTML='';
  Q.forEach(function(q,i){
    var d=document.createElement('div');d.className='qc';d.id='qc'+i;
    var opts='';
    q.opts.forEach(function(o,j){opts+='<button class="ob" id="o'+i+'_'+j+'" onclick="pick('+i+','+j+')"><span class="ol">'+L[j]+'</span><span>'+o+'</span></button>';});
    d.innerHTML='<div class="qh"><div class="qn">'+(i+1)+'</div><div class="qt">'+q.q+'</div></div><div class="opts">'+opts+'</div><div class="exp" id="ex'+i+'"><strong>✓ 解析：</strong>'+q.exp+'</div>';
    c.appendChild(d);
  });
}
function pick(qi,oi){
  if(done)return;A[qi]=oi;
  for(var j=0;j<4;j++){var b=document.getElementById('o'+qi+'_'+j);if(b){b.classList.remove('correct','wrong','reveal');b.style.cssText='';}}
  var s=document.getElementById('o'+qi+'_'+oi);if(s){s.style.cssText='border-color:#1a2744;background:#e8ecf8';}
  upd();
}
function upd(){
  var n=A.filter(function(a){return a!==null;}).length;
  document.getElementById('pb').style.width=(n/Q.length*100)+'%';
  document.getElementById('pbl').textContent=n+' / '+Q.length+' 已作答';
}
function doSub(){
  var un=A.filter(function(a){return a===null;}).length;
  if(un>0){var w=document.getElementById('wn');w.style.display='block';w.textContent='⚠ 还有 '+un+' 道题未作答，请完成后再提交。';return;}
  done=true;document.getElementById('wn').style.display='none';document.getElementById('subBtn').disabled=true;
  var ok=0;
  Q.forEach(function(q,i){
    var ua=A[i],ra=q.ans,good=(ua===ra);if(good)ok++;
    for(var j=0;j<4;j++){var b=document.getElementById('o'+i+'_'+j);if(b){b.style.cssText='';b.disabled=true;
      if(j===ra&&good&&j===ua){b.classList.add('correct');}
      else if(j===ua&&!good){b.classList.add('wrong');}
      else if(j===ra&&!good){b.classList.add('reveal');}
    }}
    if(!good){var e=document.getElementById('ex'+i);if(e)e.classList.add('show');}
  });
  var sc=Math.round(ok/Q.length*100);
  document.getElementById('scn').textContent=sc;
  document.getElementById('cc').textContent=ok;
  document.getElementById('wc').textContent=Q.length-ok;
  var t,s;
  if(sc>=90){t='🏆 非常出色！';s='羽绚，历史知识非常扎实，满分指日可待！继续努力！';}
  else if(sc>=75){t='🌟 做得很好！';s='羽绚，成绩优异！认真复习错题解析，下次会更棒！';}
  else if(sc>=60){t='👍 继续加油！';s='羽绚，基础不错！仔细阅读每道错题的解析，进步会更快！';}
  else{t='📖 再加把劲！';s='羽绚，不要气馁！认真读懂解析，再来一次，一定进步！';}
  document.getElementById('rtl').textContent=t;
  document.getElementById('rsb').textContent=s;
  document.getElementById('rp').classList.add('show');
  document.getElementById('rp').scrollIntoView({behavior:'smooth'});
}
function doReset(){
  A=new Array(Q.length).fill(null);done=false;
  document.getElementById('subBtn').disabled=false;
  document.getElementById('rp').classList.remove('show');
  document.getElementById('wn').style.display='none';
  build();upd();window.scrollTo({top:0,behavior:'smooth'});
}
build();upd();
</script></body></html>
