#subBtn:hover{background:#253560}#subBtn:active{transform:scale(.97)}#subBtn:disabled{background:#aaa;cursor:not-allowed}
.warn{display:none;color:var(--rd);font-size:12px;margin-top:.4rem}

.sc{width:106px;height:106px;border-radius:50%;background:var(--nv);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto .85rem;border:4px solid var(--gd)}

<script>
const Q=[{"q": "仄迪族（Chetti）是哪两个群体通婚的后代？", "opts": ["英国人与本地人", "来自中国的商人与当地女性", "来自印度的商人与本地女子", "葡萄牙人与马来人"], "ans": 2, "exp": "课文指出，仄迪族（Chetti）或土生印度人是来自印度的商人与本地女子通婚后所生的后代。"}, {"q": "峇峇娘惹的传统服装是什么？", "opts": ["旗袍和长衫", "纱丽和陀地", "绣花哥峇雅（kebaya bersulam）和峇迪沙笼（kain batik sarung）", "马来套装和马来男装"], "ans": 2, "exp": "课文指出，峇峇娘惹的传统服装是绣花哥峇雅（kebaya bersulam）和峇迪沙笼（kain batik sarung）。"}, {"q": "尊崇法治（Kedaulatan Undang-Undang）是国家原则第几项？", "opts": ["第二项", "第三项", "第四项", "第五项"], "ans": 2, "exp": "国家原则第四项是尊崇法治（Kedaulatan Undang-Undang），强调法律至上。"}, {"q": "印度族女性的传统服装叫什么？", "opts": ["马来套装", "旗袍", "纱丽（sari）", "绣花哥峇雅"], "ans": 2, "exp": "课文指出，印度女性的传统服装是纱丽（sari），男性服装是陀地（doti）。"}, {"q": "制定国家原则三大原因中的政治因素是什么？", "opts": ["经济地位的落差", "居住地区的分化", "政治理念的不同", "宗教分歧"], "ans": 2, "exp": "制定国家原则的政治因素是政治理念的不同——各族群在政治上的分歧需要通过国家原则来调和。"}, {"q": "以下哪个州的首府是瓜拉丁加奴，以石油天然气著称？", "opts": ["吉兰丹", "彭亨", "丁加奴（Terengganu）", "霹雳"], "ans": 2, "exp": "丁加奴州首府是瓜拉丁加奴，是马来西亚重要的石油和天然气产区。"}, {"q": "东姑阿都拉曼所属的政党是什么？", "opts": ["马华公会（MCA）", "马来民族统一机构（UMNO/巫统）", "新加坡人民行动党（PAP）", "砂拉越保守党（PESAKA）"], "ans": 1, "exp": "东姑阿都拉曼（Tunku Abdul Rahman Putra Al-Haj）是马来民族统一机构（UMNO/巫统）领袖。"}, {"q": "葛波委员会于哪一天移交民意调查报告？", "opts": ["1962年1月17日", "1962年6月21日", "1963年7月9日", "1963年8月12日"], "ans": 1, "exp": "葛波委员会于1962年6月21日移交民意调查报告予英国殖民当局与马来亚联合邦。"}, {"q": "李光耀支持成立马来西亚的主要原因是什么？", "opts": ["开发橡胶资源", "阻断共产主义在新加坡的扩张", "争取经济援助", "增加新加坡土地面积"], "ans": 1, "exp": "李光耀（PAP领袖）支持成立马来西亚以阻断共产主义在新加坡的扩张。"}, {"q": "东马的两个州位于哪个大岛上？", "opts": ["苏门答腊", "爪哇", "婆罗洲（Borneo）", "苏拉威西"], "ans": 2, "exp": "沙巴和砂拉越位于婆罗洲岛（Borneo）北部，婆罗洲是世界第三大岛。"}, {"q": "峇峇娘惹使用什么语言沟通？", "opts": ["闽南语", "客家语", "峇峇语", "克里奥尔马来语"], "ans": 2, "exp": "课文指出，峇峇娘惹以峇峇语沟通，他们的生活方式与本地文化融合而成。"}, {"q": "课文中沙吉星参加国防部突击队训练，有志捍卫国家主权，体现了哪项国家原则？", "opts": ["信奉上苍", "忠于君国", "维护宪法", "培养德行"], "ans": 1, "exp": "课文举例（沙吉星）：参与突击队训练，有志于贡献国家、捍卫独立性和主权，体现了忠于君国的精神。"}, {"q": "国家原则共有多少项功能？", "opts": ["三项", "四项", "五项", "六项"], "ans": 3, "exp": "课文列出国家原则的六项功能：塑造有宗教信仰的社会、塑造富有爱国精神的社会、培养尊重法治的态度、巩固社会团结、贯彻道德价值观、塑造有高尚情操的社会。"}, {"q": "以下哪个州与印度尼西亚苏门答腊隔马六甲海峡相望？", "opts": ["柔佛", "雪兰莪", "马六甲（Melaka）", "霹雳"], "ans": 2, "exp": "马六甲州与印度尼西亚苏门答腊隔着马六甲海峡相望，马六甲海峡是世界最繁忙航运水道之一。"}, {"q": "砂拉越沿海的马来族、马兰诺族和卡达央族从事什么经济活动？", "opts": ["种植稻米", "采集森林资源", "经商、造船和生产硕莪", "捕鱼和农耕"], "ans": 2, "exp": "课文指出，住在沿海的马来族、马兰诺族和卡达央族，从事经商、造船和生产硕莪的工作。"}, {"q": "砂拉越的首府是哪个城市？", "opts": ["亚庇", "诗巫", "古晋（Kuching）", "美里"], "ans": 2, "exp": "古晋（Kuching）是砂拉越州的首府，以猫城之称著名。"}, {"q": "正直的操守会影响我们在哪些方面的表现？", "opts": ["只影响政治", "在教育、事业和生活中的表现", "只影响经济", "只影响体育"], "ans": 1, "exp": "课文指出，正直的操守会影响我们在教育、事业和生活中的表现。"}, {"q": "独立前华族主要居住在哪里，从事什么经济活动？", "opts": ["乡村，捕鱼", "市镇与城市，采矿与经商", "园丘，种植橡胶", "内陆，狩猎"], "ans": 1, "exp": "课文指出，独立前，华族住在市镇与城市，从事采矿与经商。"}, {"q": "马来西亚面积最大的州是哪个？", "opts": ["沙巴", "砂拉越", "彭亨", "柔佛"], "ans": 1, "exp": "砂拉越（Sarawak）是马来西亚面积最大的州，位于婆罗洲岛北部，约占马来西亚总面积的37%。"}, {"q": "颁布国家原则的是马来西亚第几任最高元首？", "opts": ["第二任", "第三任", "第四任", "第五任"], "ans": 2, "exp": "国家原则由第四任国家元首苏丹依斯迈纳西鲁丁沙颁布。"}, {"q": "成立马来西亚进程中，在葛波委员会报告之后才发生的步骤是什么？", "opts": ["东姑阿都拉曼在艾德菲酒店提出概念", "成立JSKM忠诚委员会", "成立JAK跨政府委员会及新加坡公投", "东姑阿都拉曼访问砂拉越"], "ans": 2, "exp": "根据课文时间线，葛波委员会于1962年6月21日移交报告，之后才成立JAK（1962年8月30日）并举行新加坡公投。"}, {"q": "国家原则培养了各族国民的哪三种精神？", "opts": ["竞争、进步、创新", "包容、合作与相互谅解的精神", "独立、自强、个人主义", "排外、保守、固步自封"], "ans": 1, "exp": "课文指出，国家原则培养了各族国民的包容、合作与相互谅解的精神。"}, {"q": "1938年提出大马来由（Melayu Raya）概念的两位本地领袖是谁？", "opts": ["东姑阿都拉曼与敦阿都拉萨", "依布拉欣耶谷与哈仑阿米努拉昔", "李光耀与敦天猛公朱加巴里恩", "敦拿督慕斯达法哈仑与史蒂芬卡隆宁甘"], "ans": 1, "exp": "课文指出，1938年，依布拉欣耶谷（Ibrahim Haji Yaakob）和哈仑阿米努拉昔（Harun Aminurrashid）提出大马来由（Melayu Raya）的概念。"}, {"q": "各族群的文化特色需要大家如何对待？", "opts": ["可以遗忘", "改变以同化", "珍惜各族群的文化特色才能发扬光大", "只保留主流文化"], "ans": 2, "exp": "课文指出，各族群的文化特色需要大家的珍惜，才能发扬光大。"}, {"q": "Negeri Sembilan在马来语中意思是什么？", "opts": ["七个州", "八个州", "九个州", "十个州"], "ans": 2, "exp": "Negeri Sembilan在马来语中意为九个州（Nine States），由米南加保人建立的九个小酋长国合并而成。"}, {"q": "东姑阿都拉曼在成立马来西亚大典上高呼几声默迪卡？", "opts": ["三声", "五声", "七声", "九声"], "ans": 2, "exp": "课文图片说明记载：东姑阿都拉曼在宣布马来西亚成立的大典上高呼七声默迪卡。"}, {"q": "在社会层面，实践国家原则有什么效果？", "opts": ["个人财富增加", "包容与相互谅解，为社会带来和谐与安宁", "军事力量增强", "出口贸易增加"], "ans": 1, "exp": "课文指出，社会层面：包容与相互谅解，为社会带来和谐与安宁。"}, {"q": "伊班族男性在嘉华节穿什么传统服装？", "opts": ["旗袍", "陀地", "鸟裳（baju burung）和哥兰比（kelambi）", "马来男装"], "ans": 2, "exp": "课文指出，伊班族男性在嘉华节或婚宴时穿上鸟裳（baju burung）和哥兰比（kelambi）。"}, {"q": "马来西亚最高峰京那巴鲁山位于哪个州？", "opts": ["砂拉越", "彭亨", "沙巴", "霹雳"], "ans": 2, "exp": "京那巴鲁山（Mount Kinabalu）海拔4,095米，位于沙巴州，是马来西亚最高峰。"}, {"q": "以下哪个州首府是新山（Johor Bahru），与新加坡隔海相望？", "opts": ["马六甲", "雪兰莪", "柔佛（Johor）", "森美兰"], "ans": 2, "exp": "柔佛州（Johor）首府新山（Johor Bahru），与新加坡隔柔佛海峡相望。"}, {"q": "JSKM的主要目的是什么？", "opts": ["收集砂拉越与沙巴的民意", "加强砂拉越与沙巴领袖对成立马来西亚的信心", "制定宪法草案", "举行公投"], "ans": 1, "exp": "课文指出，成立JSKM是为了加强砂拉越与沙巴领袖对成立马来西亚的信心。"}, {"q": "《马来西亚协定》于哪一天签署？", "opts": ["1962年6月21日", "1963年7月9日", "1963年8月12日", "1963年9月16日"], "ans": 1, "exp": "《马来西亚协定》于1963年7月9日在英国伦敦的马尔伯勒大楼签署。"}];
let A=new Array(Q.length).fill(null),done=false;
const L=['A','B','C','D'];
function build(){
  var c=document.getElementById('qctr');c.innerHTML='';
  Q.forEach(function(q,i){
    var d=document.createElement('div');d.className='qc';d.id='qc'+i;
    var opts='';
    q.opts.forEach(function(o,j){opts+='<button class="ob" id="o'+i+'_'+j+'" onclick="pick('+i+','+j+')"><span class="ol">'+L[j]+'</span><span>'+o+'</span></button>';});
    d.innerHTML='<div class="qh"><div class="qn">'+(i+1)+'</div><div class="qt">'+q.q+'</div></div><div class="opts">'+opts+'</div><div class="exp" id="ex'+i+'"><strong>✓ 解析：</strong>'+q.exp+'</div>';
    c.appendChild(d);
  });
}
function pick(qi,oi){
  if(done)return;A[qi]=oi;
  for(var j=0;j<4;j++){var b=document.getElementById('o'+qi+'_'+j);if(b){b.classList.remove('correct','wrong','reveal');b.style.cssText='';}}
  var s=document.getElementById('o'+qi+'_'+oi);if(s){s.style.cssText='border-color:#1a2744;background:#e8ecf8';}
  upd();
}
function upd(){
  var n=A.filter(function(a){return a!==null;}).length;
  document.getElementById('pb').style.width=(n/Q.length*100)+'%';
  document.getElementById('pbl').textContent=n+' / '+Q.length+' 已作答';
}
function doSub(){
  var un=A.filter(function(a){return a===null;}).length;
  if(un>0){var w=document.getElementById('wn');w.style.display='block';w.textContent='⚠ 还有 '+un+' 道题未作答，请完成后再提交。';return;}
  done=true;document.getElementById('wn').style.display='none';document.getElementById('subBtn').disabled=true;
  var ok=0;
  Q.forEach(function(q,i){
    var ua=A[i],ra=q.ans,good=(ua===ra);if(good)ok++;
    for(var j=0;j<4;j++){var b=document.getElementById('o'+i+'_'+j);if(b){b.style.cssText='';b.disabled=true;
      if(j===ra&&good&&j===ua){b.classList.add('correct');}
      else if(j===ua&&!good){b.classList.add('wrong');}
      else if(j===ra&&!good){b.classList.add('reveal');}
    }}
    if(!good){var e=document.getElementById('ex'+i);if(e)e.classList.add('show');}
  });
  var sc=Math.round(ok/Q.length*100);
  document.getElementById('scn').textContent=sc;
  document.getElementById('cc').textContent=ok;
  document.getElementById('wc').textContent=Q.length-ok;
  var t,s;
  if(sc>=90){t='🏆 非常出色！';s='羽绚，历史知识非常扎实，满分指日可待！继续努力！';}
  else if(sc>=75){t='🌟 做得很好！';s='羽绚，成绩优异！认真复习错题解析，下次会更棒！';}
  else if(sc>=60){t='👍 继续加油！';s='羽绚，基础不错！仔细阅读每道错题的解析，进步会更快！';}
  else{t='📖 再加把劲！';s='羽绚，不要气馁！认真读懂解析，再来一次，一定进步！';}
  document.getElementById('rtl').textContent=t;
  document.getElementById('rsb').textContent=s;
  document.getElementById('rp').classList.add('show');
  document.getElementById('rp').scrollIntoView({behavior:'smooth'});
}
function doReset(){
  A=new Array(Q.length).fill(null);done=false;
  document.getElementById('subBtn').disabled=false;
  document.getElementById('rp').classList.remove('show');
  document.getElementById('wn').style.display='none';
  build();upd();window.scrollTo({top:0,behavior:'smooth'});
}
build();upd();
</script></body></html>
