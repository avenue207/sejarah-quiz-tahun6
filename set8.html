<style>:root{--nv:#1a2744;--gd:#d4a017;--gn:#1a7a4a;--gnb:#27ae60;--gnl:#eaf7ee;--rd:#c0392b;--rdb:#e74c3c;--rdl:#fdf0ef;--bd:#dde2ef;--bg:#f0f2f5;--wh:#fff;--ink:#2c2c2c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.hdr{background:var(--nv);color:#fff;padding:1.4rem 1rem 1.1rem;text-align:center;border-bottom:4px solid var(--gd)}
.hsub{font-size:11px;color:#aab4cc;letter-spacing:.07em;margin-bottom:4px}
h1{font-family:'Noto Serif SC',serif;font-size:clamp(15px,4vw,23px);font-weight:700}
.b1{display:inline-block;background:var(--gd);color:var(--nv);font-size:11px;font-weight:700;padding:3px 11px;border-radius:99px;margin:5px 3px 0}
.b2{display:inline-block;background:rgba(255,255,255,.12);color:#c0cadc;font-size:11px;font-weight:600;padding:3px 11px;border-radius:99px;margin:5px 3px 0}
.pbw{background:rgba(255,255,255,.15);border-radius:99px;height:5px;margin:9px auto 0;max-width:320px}
.pb{background:var(--gd);height:5px;border-radius:99px;transition:width .4s;width:0%}
.pbl{font-size:11px;color:#aab4cc;text-align:center;margin-top:3px}
.nav{background:#111d33;padding:.5rem .7rem;display:flex;justify-content:center;gap:5px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.07)}
.nav a{color:#aab4cc;font-size:11px;text-decoration:none;padding:4px 8px;border-radius:99px;border:1px solid rgba(255,255,255,.12);transition:all .15s;white-space:nowrap}
.nav a:hover,.nav a.active{background:var(--gd);color:var(--nv);border-color:var(--gd);font-weight:700}
.ctr{max-width:720px;margin:0 auto;padding:1.1rem 1rem 4rem}
.qc{background:var(--wh);border:1px solid var(--bd);border-radius:11px;padding:1.1rem;margin-bottom:.85rem}
.qh{display:flex;align-items:flex-start;gap:8px;margin-bottom:.75rem}
.qn{background:var(--nv);color:#fff;font-size:10px;font-weight:700;border-radius:99px;min-width:25px;height:25px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qt{font-size:14px;line-height:1.65;font-weight:500;padding-top:2px}
.opts{display:flex;flex-direction:column;gap:6px}
.ob{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--bd);border-radius:7px;padding:.58rem .8rem;cursor:pointer;font-family:'Noto Sans SC',sans-serif;font-size:13.5px;text-align:left;transition:border-color .15s,background .15s;color:var(--ink)}
.ob:hover:not(:disabled){border-color:var(--nv);background:#e8ecf8}
.ol{background:var(--nv);color:#fff;font-size:10px;font-weight:700;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ob.correct{border-color:var(--gnb);background:var(--gnl)}.ob.correct .ol{background:var(--gn)}
.ob.wrong{border-color:var(--rdb);background:var(--rdl)}.ob.wrong .ol{background:var(--rd)}
.ob.reveal{border-color:var(--gnb);background:var(--gnl);opacity:.72}.ob.reveal .ol{background:var(--gn)}
.exp{display:none;margin-top:.75rem;background:#fff8e1;border-left:4px solid var(--gd);border-radius:0 7px 7px 0;padding:.6rem .85rem;font-size:13px;line-height:1.65;color:#5a4a1a}
.exp.show{display:block}.exp strong{color:var(--nv)}
.ssec{text-align:center;margin:1.6rem 0}
#subBtn{background:var(--nv);color:#fff;font-family:'Noto Sans SC',sans-serif;font-size:15px;font-weight:700;padding:.78rem 2.4rem;border:none;border-radius:99px;cursor:pointer;letter-spacing:.07em;transition:background .2s}
#subBtn:hover{background:#253560}#subBtn:active{transform:scale(.97)}#subBtn:disabled{background:#aaa;cursor:not-allowed}
.warn{display:none;color:var(--rd);font-size:12px;margin-top:.4rem}
.rp{display:none;background:var(--wh);border:2px solid var(--nv);border-radius:14px;padding:1.8rem 1.4rem;text-align:center;margin:1.5rem 0}
.rp.show{display:block}
.sc{width:106px;height:106px;border-radius:50%;background:var(--nv);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto .85rem;border:4px solid var(--gd)}
.sn{font-family:'Noto Serif SC',serif;font-size:32px;font-weight:700;line-height:1}
.sl{font-size:11px;color:#aab4cc;margin-top:2px}
.rtl{font-family:'Noto Serif SC',serif;font-size:19px;font-weight:700;color:var(--nv);margin-bottom:4px}
.rsb{font-size:13px;color:#666;margin-bottom:1.1rem;line-height:1.6}
.rstats{display:flex;justify-content:center;gap:2rem;margin-bottom:1.1rem}
.stat{text-align:center}.stn{font-size:25px;font-weight:700;font-family:'Noto Serif SC',serif}
.stn.c{color:var(--gn)}.stn.w{color:var(--rd)}.stl{font-size:11px;color:#888}
.brow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:.5rem}
#retBtn{background:transparent;color:var(--nv);font-family:'Noto Sans SC',sans-serif;font-size:13px;font-weight:500;padding:.52rem 1.5rem;border:2px solid var(--nv);border-radius:99px;cursor:pointer;transition:background .2s}
#retBtn:hover{background:#e8ecf8}
.bnxt{display:inline-block;background:var(--gd);color:var(--nv);font-family:'Noto Sans SC',sans-serif;font-size:13px;font-weight:700;padding:.52rem 1.5rem;border-radius:99px;text-decoration:none;letter-spacing:.04em}</style></head><body>

<script>const Q=[{"q": "跨政府委员会（JAK）的主要职责是什么？", "opts": ["进行民意调查", "制定保障砂拉越与沙巴权益的宪法草案", "举行公投", "签署《马来西亚协定》"], "ans": 1, "exp": "跨政府委员会（Jawatankuasa Antara Kerajaan，JAK）的工作是制定保障砂拉越与沙巴权益的宪法草案。"}, {"q": "以下哪位马来西亚领袖被誉为现代化之父，大力推动工业化发展？", "opts": ["东姑阿都拉曼", "敦拉萨", "敦胡先翁", "敦马哈迪"], "ans": 3, "exp": "敦马哈迪在任期间大力推动马来西亚工业化和现代化发展，被视为马来西亚现代化的重要推动者。"}, {"q": "以下哪个族群是沙巴最大的族群？", "opts": ["伊班族", "巴瑶族", "卡达山杜顺族", "龙古斯族"], "ans": 2, "exp": "课文指出，卡达山杜顺族是沙巴最大的族群，其中的族群分支拥有自己的语言。"}, {"q": "以下哪个州以米南加保双尖牛角屋顶建筑著称？", "opts": ["霹雳", "吉打", "森美兰（Negeri Sembilan）", "彭亨"], "ans": 2, "exp": "森美兰州受米南加保文化影响，以独特的双尖牛角屋顶（Rumah Minangkabau）传统建筑著称。"}, {"q": "藤球（Sepak Takraw）是马来西亚的传统运动，以什么工具进行比赛？", "opts": ["木棍", "脚、膝盖、头和胸部，不可用手", "球棒", "球拍"], "ans": 1, "exp": "藤球（Sepak Takraw）是马来西亚传统运动，规则是用脚、膝盖、头和胸部击球，不可用手触球。"}, {"q": "砂拉越的首府是哪个城市？", "opts": ["亚庇", "诗巫", "古晋（Kuching）", "美里"], "ans": 2, "exp": "古晋（Kuching）是砂拉越州的首府，以猫城之称著名。"}, {"q": "国家原则颁布时，马来西亚庆祝独立多少周年？", "opts": ["10周年", "11周年", "12周年", "13周年"], "ans": 3, "exp": "马来西亚于1957年独立，1970年8月31日颁布国家原则时，正庆祝独立13周年。"}, {"q": "马来西亚各族宗教和谐共处体现了什么？", "opts": ["单一文化的优势", "马来西亚多元宗教和谐共存的独特国情", "宗教竞争的结果", "政府强制推行的政策"], "ans": 1, "exp": "马来西亚多元宗教和谐共处是马来西亚的独特国情，各族按自己的宗教信仰生活，彼此尊重包容。"}, {"q": "马来西亚目前是全球最大的哪种农业商品生产国之一？", "opts": ["稻米", "橡胶", "棕榈油", "可可"], "ans": 2, "exp": "马来西亚是全球最大的棕榈油（minyak sawit）生产和出口国之一，棕榈油是重要的农业出口商品。"}, {"q": "马来西亚国家石油公司（Petronas）成立于哪一年？", "opts": ["1966年", "1970年", "1974年", "1980年"], "ans": 2, "exp": "Petronas（马来西亚国家石油公司）成立于1974年，负责管理马来西亚的石油和天然气资源。"}, {"q": "丰收节（Kaamatan）是沙巴哪个族群最重要的节日？", "opts": ["伊班族", "巴瑶族", "卡达山杜顺族", "龙古斯族"], "ans": 2, "exp": "丰收节（Kaamatan）是沙巴卡达山杜顺族最重要的节日，于每年5月庆祝，感谢稻米丰收。"}, {"q": "以下哪个节日与中国传统的赏月、吃月饼习俗有关？", "opts": ["元宵节", "端午节", "中秋节", "清明节"], "ans": 2, "exp": "中秋节是华族的传统节日，以赏月、提灯笼、吃月饼等习俗庆祝，也是马来西亚华裔的重要传统节庆。"}, {"q": "各族群的文化特色需要大家如何对待？", "opts": ["可以遗忘", "改变以同化", "珍惜各族群的文化特色才能发扬光大", "只保留主流文化"], "ans": 2, "exp": "课文指出，各族群的文化特色需要大家的珍惜，才能发扬光大，体现了文化多元共存的精神。"}, {"q": "马来西亚国家石油公司双子塔（Petronas Twin Towers）于哪一年落成？", "opts": ["1995年", "1996年", "1998年", "2000年"], "ans": 2, "exp": "马来西亚国家石油双子塔（Petronas Twin Towers）于1998年落成，曾是世界上最高的建筑物。"}, {"q": "印度裔马来西亚人普遍信奉哪种宗教？", "opts": ["伊斯兰教", "佛教", "印度教", "基督教"], "ans": 2, "exp": "印度裔马来西亚人（尤其是淡米尔族）普遍信奉印度教（Hinduisme），在马来西亚各地有众多印度庙。"}, {"q": "彭亨州最著名的国家公园是什么？", "opts": ["百乐公园", "塔曼尼加拉国家公园", "京那巴鲁国家公园", "砂拉越洞穴公园"], "ans": 1, "exp": "彭亨州拥有著名的塔曼尼加拉国家公园（Taman Negara），是全球最古老的热带雨林之一。"}, {"q": "Negeri Sembilan在马来语中意思是什么？", "opts": ["七个州", "八个州", "九个州", "十个州"], "ans": 2, "exp": "Negeri Sembilan意为九个州（Nine States），由米南加保人建立的九个小酋长国合并而成。"}, {"q": "东姑阿都拉曼在成立马来西亚大典上高呼了几声默迪卡？", "opts": ["三声", "五声", "七声", "九声"], "ans": 2, "exp": "课文图片说明记载：东姑阿都拉曼在宣布马来西亚成立的大典上高呼七声默迪卡。"}, {"q": "伊斯兰教的礼拜场所称为什么？", "opts": ["庙宇（Kuil）", "教堂（Gereja）", "清真寺（Masjid）", "神庙（Tokong）"], "ans": 2, "exp": "伊斯兰教的礼拜场所称为清真寺（Masjid），是穆斯林进行礼拜和宗教活动的神圣场所。"}, {"q": "以下哪个是正确的国家原则顺序？", "opts": ["忠于君国、信奉上苍、维护宪法、尊崇法治、培养德行", "信奉上苍、忠于君国、维护宪法、尊崇法治、培养德行", "培养德行、尊崇法治、维护宪法、忠于君国、信奉上苍", "维护宪法、信奉上苍、忠于君国、尊崇法治、培养德行"], "ans": 1, "exp": "国家原则正确顺序：信奉上苍（1）、忠于君国（2）、维护宪法（3）、尊崇法治（4）、培养德行（5）。"}, {"q": "马来西亚的国家领袖在国家发展中最重要的贡献是什么？", "opts": ["增加国防开支", "通过协商与合作促进国家团结与发展", "推动单一民族政策", "加强与外国的军事联盟"], "ans": 1, "exp": "马来西亚国家领袖最重要的贡献是通过协商与合作，促进各族团结与国家发展，为人民谋求福祉。"}, {"q": "以下哪个是马来西亚重要的旅游景点，曾被列为世界最高双子塔？", "opts": ["布特拉贾亚喷泉", "国家博物馆", "国家石油双子塔（Petronas Twin Towers）", "独立广场"], "ans": 2, "exp": "国家石油双子塔（Petronas Twin Towers）曾是世界最高双子塔，是马来西亚的标志性建筑，吸引大量游客。"}, {"q": "马来西亚第一任首相是谁？", "opts": ["敦拉萨", "东姑阿都拉曼", "敦胡先翁", "敦马哈迪"], "ans": 1, "exp": "东姑阿都拉曼（Tunku Abdul Rahman Putra Al-Haj）是马来西亚独立后的第一任首相，任期1957–1970年。"}, {"q": "以下哪个族群是砂拉越最大的族群？", "opts": ["马兰诺族", "卡达山杜顺族", "伊班族", "比达友族"], "ans": 2, "exp": "课文明确指出，伊班族是砂拉越最大的族群，他们的沟通语言是伊班语。"}, {"q": "传统陀螺游戏（Gasing）在马来西亚最受哪个族群喜爱？", "opts": ["华族", "印度族", "马来族", "伊班族"], "ans": 2, "exp": "陀螺游戏（Gasing）是马来传统民间游戏，在马来族社区中最为流行，陀螺可重达几公斤并可旋转数小时。"}, {"q": "色拉尼族（Serani）又称什么，是哪两个群体通婚的后代？", "opts": ["峇峇；中国商人与本地女性", "土生印度人；印度商人与本地女性", "欧亚裔；葡萄牙人与本地人", "暹罗人；泰族与马来人"], "ans": 2, "exp": "课文指出，色拉尼族（Serani）又称欧亚裔，是葡萄牙人和本地人通婚的后代。"}, {"q": "维护宪法（Keluhuran Perlembagaan）是国家原则第几项？", "opts": ["第一项", "第二项", "第三项", "第四项"], "ans": 2, "exp": "国家原则第三项是维护宪法（Keluhuran Perlembagaan），强调尊重联邦宪法的崇高地位。"}, {"q": "马来西亚青年和体育部推行国民运动文化的目的是什么？", "opts": ["只为参加奥运会", "培养健康生活方式、团队精神和爱国情操", "减少国家开支", "增加旅游收入"], "ans": 1, "exp": "马来西亚推行国民运动文化是为了培养国民的健康生活方式、团队精神和爱国情操，促进全民参与体育活动。"}, {"q": "葛波委员会的报告显示什么结果？", "opts": ["全部人民反对", "三分之一人民支持", "三分之二的砂拉越与沙巴人民支持成立马来西亚", "投票各半"], "ans": 2, "exp": "葛波委员会报告显示，三分之二的砂拉越与沙巴人民支持成立马来西亚。"}, {"q": "忠于君国（Kesetiaan kepada Raja dan Negara）是国家原则第几项？", "opts": ["第一项", "第二项", "第三项", "第四项"], "ans": 1, "exp": "国家原则第二项是忠于君国（Kesetiaan kepada Raja dan Negara），强调对最高元首和国家的忠诚。"}, {"q": "马来西亚运动员在体育上取得成就有什么重要意义？", "opts": ["只为个人荣誉", "为国家赢得荣誉，激励国民团结并提升国家形象", "只为争取奖金", "与其他国家竞争以显示军事力量"], "ans": 1, "exp": "马来西亚运动员在体育上的成就为国家赢得荣誉，激励国民团结，并在国际舞台上提升马来西亚的国家形象。"}, {"q": "马来西亚宪法第3条规定什么是官方宗教，同时保障什么？", "opts": ["佛教为官方宗教，其他宗教不受保护", "伊斯兰教为官方宗教，其他宗教可在和平与和谐中奉行", "基督教为官方宗教，其他宗教须申请许可", "印度教为官方宗教，其他宗教可自由奉行"], "ans": 1, "exp": "联邦宪法第3条规定伊斯兰教为官方宗教，同时保障其他宗教可在和平与和谐中奉行，体现宗教自由。"}, {"q": "以下哪个节日在马来西亚标志着基督徒庆祝耶稣诞生的节日？", "opts": ["开斋节", "中秋节", "圣诞节（Hari Krismas）", "卫塞节"], "ans": 2, "exp": "圣诞节（Hari Krismas）于12月25日庆祝，是基督徒纪念耶稣诞生的重要节日，也是马来西亚的公共假期。"}, {"q": "马来西亚最初的成立概念包括哪五个地方？", "opts": ["马来亚、砂拉越、沙巴、新加坡与汶莱", "马来亚、砂拉越、沙巴与新加坡", "马来亚、砂拉越与沙巴", "马来亚与新加坡"], "ans": 0, "exp": "成立马来西亚的最初概念包括马来亚联合邦、砂拉越、沙巴、新加坡与汶莱，但汶莱最终没有加入。"}, {"q": "嘉华节（Gawai）是砂拉越哪个族群的重要节日？", "opts": ["卡达山杜顺族", "马兰诺族", "伊班族（达雅族）", "比达友族"], "ans": 2, "exp": "嘉华节（Gawai）是砂拉越达雅族（尤其是伊班族）最重要的节日，于每年6月1日庆祝稻米丰收。"}, {"q": "敦阿都拉萨（Tun Abdul Razak）是马来西亚第几任首相？", "opts": ["第一任", "第二任", "第三任", "第四任"], "ans": 1, "exp": "敦阿都拉萨（Tun Abdul Razak Hussein）是马来西亚第二任首相，任期1970–1976年，推行新经济政策。"}];
let A=new Array(Q.length).fill(null),done=false;
const L=['A','B','C','D'];
function build(){
  var c=document.getElementById('qctr');c.innerHTML='';
  Q.forEach(function(q,i){
    var d=document.createElement('div');d.className='qc';d.id='qc'+i;
    var opts='';
    q.opts.forEach(function(o,j){opts+='<button class="ob" id="o'+i+'_'+j+'" onclick="pick('+i+','+j+')"><span class="ol">'+L[j]+'</span><span>'+o+'</span></button>';});
    d.innerHTML='<div class="qh"><div class="qn">'+(i+1)+'</div><div class="qt">'+q.q+'</div></div><div class="opts">'+opts+'</div><div class="exp" id="ex'+i+'"><strong>✓ 解析：</strong>'+q.exp+'</div>';
    c.appendChild(d);
  });
}
function pick(qi,oi){
  if(done)return;A[qi]=oi;
  for(var j=0;j<4;j++){var b=document.getElementById('o'+qi+'_'+j);if(b){b.classList.remove('correct','wrong','reveal');b.style.cssText='';}}
  var s=document.getElementById('o'+qi+'_'+oi);if(s){s.style.cssText='border-color:#1a2744;background:#e8ecf8';}
  upd();
}
function upd(){
  var n=A.filter(function(a){return a!==null;}).length;
  document.getElementById('pb').style.width=(n/Q.length*100)+'%%';
  document.getElementById('pbl').textContent=n+' / '+Q.length+' 已作答';
}
function doSub(){
  var un=A.filter(function(a){return a===null;}).length;
  if(un>0){var w=document.getElementById('wn');w.style.display='block';w.textContent='⚠ 还有 '+un+' 道题未作答，请完成后再提交。';return;}
  done=true;document.getElementById('wn').style.display='none';document.getElementById('subBtn').disabled=true;
  var ok=0;
  Q.forEach(function(q,i){
    var ua=A[i],ra=q.ans,good=(ua===ra);if(good)ok++;
    for(var j=0;j<4;j++){var b=document.getElementById('o'+i+'_'+j);if(b){b.style.cssText='';b.disabled=true;
      if(j===ra&&good&&j===ua){b.classList.add('correct');}
      else if(j===ua&&!good){b.classList.add('wrong');}
      else if(j===ra&&!good){b.classList.add('reveal');}
    }}
    if(!good){var e=document.getElementById('ex'+i);if(e)e.classList.add('show');}
  });
  var sc=Math.round(ok/Q.length*100);
  document.getElementById('scn').textContent=sc;
  document.getElementById('cc').textContent=ok;
  document.getElementById('wc').textContent=Q.length-ok;
  var t,s;
  if(sc>=90){t='🏆 非常出色！';s='羽绚，历史知识非常扎实，满分指日可待！继续努力！';}
  else if(sc>=75){t='🌟 做得很好！';s='羽绚，成绩优异！认真复习错题解析，下次会更棒！';}
  else if(sc>=60){t='👍 继续加油！';s='羽绚，基础不错！仔细阅读每道错题的解析，进步会更快！';}
  else{t='📖 再加把劲！';s='羽绚，不要气馁！认真读懂解析，再来一次，一定进步！';}
  document.getElementById('rtl').textContent=t;
  document.getElementById('rsb').textContent=s;
  document.getElementById('rp').classList.add('show');
  document.getElementById('rp').scrollIntoView({behavior:'smooth'});
}
function doReset(){
  A=new Array(Q.length).fill(null);done=false;
  document.getElementById('subBtn').disabled=false;
  document.getElementById('rp').classList.remove('show');
  document.getElementById('wn').style.display='none';
  build();upd();window.scrollTo({top:0,behavior:'smooth'});
}
build();upd();</script></body></html>
